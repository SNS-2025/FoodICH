    <!-- 3D Scene Container -->
    <div id="scene-container"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="js/main.js"></script>

    <script>
        // 3D Scene Setup - Preserved from v2
        let scene, camera, renderer, controls;
        let fbxModels = [];
        let textMesh;
        let animationId;
        let isAnimating = true;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let hoveredModel = null;
        let isHovering = false;

        // Model configuration with dish IDs for modal
        const modelConfig = [
            { path: '../models/claypot-rice.fbx', dishId: 'claypot' },
            { path: '../models/meat-bun.fbx', dishId: 'steam-buns' },
            { path: '../models/garden-tofu.fbx', dishId: 'hakka-tofu' },
            { path: '../models/healthy-ribs.fbx', dishId: 'healthy-ribs' },
            { path: '../models/spicy-ribs.fbx', dishId: 'stir-fried-beef' },
            { path: '../models/preserved-veg-pork.fbx', dishId: 'preserved-veg-pork' },
            { path: '../models/vermicelli-shrimp.fbx', dishId: 'vermicelli-shrimp' }
        ];

        // Particle colors - colorful like v2
        const particleColors = [0xff6b6b, 0xff2e8f, 0xff9021, 0x94ed5c, 0xfeca57, 0xff9ff3, 0xbaeaa9];

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x2a0808, 50, 200);  // 深红色雾效

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 50);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('scene-container').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            addLights();
            create3DText();
            loadFBXModels();
            // addParticles(); // Temporarily hidden

            animate();

            window.addEventListener('resize', onWindowResize, false);
            renderer.domElement.addEventListener('mousemove', onMouseMove, false);
            renderer.domElement.addEventListener('click', onMouseClick, false);
            renderer.domElement.addEventListener('touchstart', onTouchStart, false);
            renderer.domElement.addEventListener('touchend', onTouchEnd, false);
        }

        function addLights() {
            // Studio lighting setup - three-point lighting
            // Key light - main illumination from front-right
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
            keyLight.position.set(30, 40, 30);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            scene.add(keyLight);

            // Fill light - softer light from left to reduce harsh shadows
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.8);
            fillLight.position.set(-30, 20, 20);
            scene.add(fillLight);

            // Rim/back light - creates edge highlight for depth
            const rimLight = new THREE.DirectionalLight(0xffffff, 1.2);
            rimLight.position.set(0, 10, -30);
            scene.add(rimLight);

            // Ambient light - overall soft fill
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            // Accent lights for color highlights
            const warmAccent = new THREE.PointLight(0xFFD700, 0.5, 100);
            warmAccent.position.set(20, 15, 20);
            scene.add(warmAccent);

            const coolAccent = new THREE.PointLight(0xC0C0C0, 0.4, 100);
            coolAccent.position.set(-20, 10, 15);
            scene.add(coolAccent);
        }

        function create3DText() {
            const loader = new THREE.FontLoader();
            loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', function(font) {
                // Silver and Gold - Studio lighting look
                const textLines = [
                    { text: 'WHAT YOU', color: 0xC0C0C0, height: 1, isSilver: true },
                    { text: 'SEE', color: 0xCC9900, height: 4, isGold: true },
                    { text: 'IS WHAT YOU', color: 0xC0C0C0, height: 1, isSilver: true },
                    { text: 'EAT', color: 0xCC9900, height: 4, isGold: true }
                ];

                const textGroup = new THREE.Group();
                const lineHeight = 4;
                const totalHeight = (textLines.length - 1) * lineHeight;

                textLines.forEach((line, index) => {
                    const material = new THREE.MeshStandardMaterial({
                        color: line.color,
                        metalness: 0.9,
                        roughness: line.isGold ? 0.2 : 0.15,
                        transparent: true,
                        opacity: 0.85,
                        envMapIntensity: 1.5
                    });

                    const textGeometry = new THREE.TextGeometry(line.text, {
                        font: font,
                        size: 3,
                        height: line.height,
                        curveSegments: 12,
                        bevelEnabled: true,
                        bevelThickness: 0.1,
                        bevelSize: 0.1,
                        bevelSegments: 5
                    });

                    textGeometry.computeBoundingBox();
                    const box = textGeometry.boundingBox;
                    const centerOffsetX = -0.5 * (box.max.x - box.min.x);
                    const centerOffsetZ = -0.5 * (box.max.z - box.min.z);
                    textGeometry.translate(centerOffsetX, 0, centerOffsetZ);

                    const mesh = new THREE.Mesh(textGeometry, material);
                    mesh.position.y = (totalHeight / 2) - (index * lineHeight);
                    mesh.castShadow = true;
                    mesh.receiveShadow = true;

                    textGroup.add(mesh);
                });

                scene.add(textGroup);
                textMesh = textGroup;
            });
        }

        function loadFBXModels() {
            const loader = new THREE.FBXLoader();

            modelConfig.forEach((config, index) => {
                loader.load(config.path, function(object) {
                    object.scale.setScalar(0.08);
                    object.rotation.x = Math.PI * 40 / 180;

                    const angle = (index / modelConfig.length) * Math.PI * 2;
                    const radius = 30;
                    object.position.x = Math.cos(angle) * radius;
                    object.position.z = Math.sin(angle) * radius;
                    object.position.y = 0;

                    object.userData = {
                        angle: angle,
                        radius: radius,
                        rotationSpeed: 0.002,
                        originalScale: 0.08,
                        dishId: config.dishId,
                        isHovered: false
                    };

                    object.castShadow = true;
                    object.receiveShadow = true;

                    object.traverse(function(child) {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            if (child.material) {
                                const mats = Array.isArray(child.material) ? child.material : [child.material];
                                mats.forEach(mat => {
                                    if (mat.map) {
                                        mat.map.flipY = true;
                                        mat.map.needsUpdate = true;
                                    }
                                    mat.needsUpdate = true;
                                });
                            }
                        }
                    });

                    scene.add(object);
                    fbxModels.push(object);
                }, undefined, function(error) {
                    console.error('FBX Load Failed:', config.path, error);
                });
            });
        }

        function addParticles() {
            const particleCount = 800;
            const particles = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * 200;
                positions[i * 3 + 1] = (Math.random() - 0.5) * 200;
                positions[i * 3 + 2] = (Math.random() - 0.5) * 200;

                const color = new THREE.Color(particleColors[Math.floor(Math.random() * particleColors.length)]);
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }

            particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particles.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const particleMaterial = new THREE.PointsMaterial({
                size: 1.5,
                vertexColors: true,
                transparent: true,
                opacity: 0.4
            });

            const particleSystem = new THREE.Points(particles, particleMaterial);
            scene.add(particleSystem);
        }

        function animate() {
            if (isAnimating) {
                animationId = requestAnimationFrame(animate);
            }

            const time = Date.now() * 0.001;

            if (!isHovering) {
                if (textMesh) {
                    textMesh.lookAt(camera.position);
                    textMesh.position.y = Math.sin(time * 0.5) * 1;
                }

                fbxModels.forEach((model, index) => {
                    if (model.userData && !model.userData.isHovered) {
                        model.userData.angle += model.userData.rotationSpeed;
                        model.position.x = Math.cos(model.userData.angle) * model.userData.radius;
                        model.position.z = Math.sin(model.userData.angle) * model.userData.radius;
                        model.position.y = Math.sin(time * 0.3 + index) * 6;
                        model.rotation.y += 0.01;
                    }
                });

                if (controls.autoRotate) {
                    controls.update();
                }
            } else {
                const wasAutoRotate = controls.autoRotate;
                controls.autoRotate = false;
                controls.update();
                controls.autoRotate = wasAutoRotate;
            }

            renderer.render(scene, camera);
        }

        function resetCamera() {
            camera.position.set(0, 0, 50);
            controls.reset();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function getEventCoordinates(event) {
            let clientX, clientY;

            if (event.touches && event.touches.length > 0) {
                clientX = event.touches[0].clientX;
                clientY = event.touches[0].clientY;
            } else if (event.changedTouches && event.changedTouches.length > 0) {
                clientX = event.changedTouches[0].clientX;
                clientY = event.changedTouches[0].clientY;
            } else {
                clientX = event.clientX;
                clientY = event.clientY;
            }

            return {
                x: (clientX / window.innerWidth) * 2 - 1,
                y: -(clientY / window.innerHeight) * 2 + 1
            };
        }

        function checkModelIntersection(event) {
            const coords = getEventCoordinates(event);
            mouse.x = coords.x;
            mouse.y = coords.y;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(fbxModels, true);

            if (intersects.length > 0) {
                let targetModel = intersects[0].object;
                while (targetModel.parent && !fbxModels.includes(targetModel)) {
                    targetModel = targetModel.parent;
                }

                if (fbxModels.includes(targetModel)) {
                    return targetModel;
                }
            }

            return null;
        }

        function onMouseMove(event) {
            const targetModel = checkModelIntersection(event);

            if (targetModel && targetModel.userData.dishId) {
                if (hoveredModel !== targetModel) {
                    if (hoveredModel) {
                        resetModelState(hoveredModel);
                    }
                    hoveredModel = targetModel;
                    setModelHovered(hoveredModel);
                }
                renderer.domElement.style.cursor = 'pointer';
                isHovering = true;
            } else {
                if (hoveredModel) {
                    resetModelState(hoveredModel);
                    hoveredModel = null;
                }
                renderer.domElement.style.cursor = 'default';
                isHovering = false;
            }
        }

        function onMouseClick(event) {
            if (hoveredModel && hoveredModel.userData.dishId) {
                enterDishDetail(hoveredModel.userData.dishId);
            }
        }

        function onTouchStart(event) {
            event.preventDefault();
            const targetModel = checkModelIntersection(event);

            if (targetModel && targetModel.userData.dishId) {
                if (hoveredModel && hoveredModel !== targetModel) {
                    resetModelState(hoveredModel);
                }
                hoveredModel = targetModel;
                setModelHovered(hoveredModel);
                isHovering = true;
            }
        }

        function onTouchEnd(event) {
            event.preventDefault();
            const targetModel = checkModelIntersection(event);

            if (targetModel && hoveredModel === targetModel && targetModel.userData.dishId) {
                enterDishDetail(targetModel.userData.dishId);
            }

            if (hoveredModel) {
                resetModelState(hoveredModel);
                hoveredModel = null;
            }
            isHovering = false;
        }

        function setModelHovered(model) {
            if (model.userData) {
                model.userData.isHovered = true;
                const targetScale = model.userData.originalScale * 1.2;
                model.scale.setScalar(targetScale);

                model.traverse(function(child) {
                    if (child.isMesh && child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(mat => {
                            mat.emissive = new THREE.Color(0x444444);
                            mat.needsUpdate = true;
                        });
                    }
                });
            }
        }

        function resetModelState(model) {
            if (model.userData) {
                model.userData.isHovered = false;
                model.scale.setScalar(model.userData.originalScale);

                model.traverse(function(child) {
                    if (child.isMesh && child.material) {
                        const mats = Array.isArray(child.material) ? child.material : [child.material];
                        mats.forEach(mat => {
                            mat.emissive = new THREE.Color(0x000000);
                            mat.needsUpdate = true;
                        });
                    }
                });
            }
        }

        init();
    </script>

    <!-- Shader Background - Flowing Gradient Noise -->
    <script>
    (function() {
        const canvas = document.getElementById('shader-bg');
        if (!canvas) return;

        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (!gl) return;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        resize();
        window.addEventListener('resize', resize);

        const vertSrc = `
            attribute vec2 a_position;
            void main() {
                gl_Position = vec4(a_position, 0.0, 1.0);
            }
        `;

        const fragSrc = `
            precision highp float;
            uniform float u_time;
            uniform vec2 u_resolution;
            uniform vec2 u_mouse;
            uniform vec2 u_mouse_vel;
            uniform float u_zoom;

            // Simplex-ish hash
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }

            float snoise(vec2 v) {
                const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                                   -0.577350269189626, 0.024390243902439);
                vec2 i  = floor(v + dot(v, C.yy));
                vec2 x0 = v - i + dot(i, C.xx);
                vec2 i1;
                i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                vec4 x12 = x0.xyxy + C.xxzz;
                x12.xy -= i1;
                i = mod289(i);
                vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
                vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
                m = m * m;
                m = m * m;
                vec3 x = 2.0 * fract(p * C.www) - 1.0;
                vec3 h = abs(x) - 0.5;
                vec3 ox = floor(x + 0.5);
                vec3 a0 = x - ox;
                m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
                vec3 g;
                g.x = a0.x * x0.x + h.x * x0.y;
                g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                return 130.0 * dot(m, g);
            }

            float fbm(vec2 p) {
                float value = 0.0;
                float amplitude = 0.5;
                float frequency = 1.0;
                for (int i = 0; i < 5; i++) {
                    value += amplitude * snoise(p * frequency);
                    frequency *= 2.0;
                    amplitude *= 0.5;
                }
                return value;
            }

            void main() {
                vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                float t = u_time * 0.15;

                // Zoom
                float zoomScale = u_zoom;
                vec2 zUv = (uv - 0.5) * zoomScale + 0.5;

                // === Water ripple disturbance ===
                vec2 toMouse = zUv - u_mouse;
                float mouseDist = length(toMouse);
                vec2 toMouseNorm = toMouse / (mouseDist + 0.001);

                // Ripple rings: concentric sine waves expanding from mouse
                float rippleFreq = 40.0;
                float rippleWave = sin(mouseDist * rippleFreq - u_time * 3.0);
                // Decay with distance
                float rippleDecay = exp(-mouseDist * 8.0);
                // Only when mouse is moving (vel length > threshold)
                float velMag = length(u_mouse_vel);
                float velInfluence = smoothstep(0.001, 0.005, velMag);
                float ripple = rippleWave * rippleDecay * velInfluence;

                // V-shaped wake behind movement direction
                vec2 velDir = normalize(u_mouse_vel + 0.0001);
                float behindMouse = dot(toMouse, velDir); // negative = behind
                float lateralDist = abs(dot(toMouse, vec2(-velDir.y, velDir.x)));
                // Wake envelope: V shape opening behind mouse
                float wakeAngle = atan(lateralDist, -behindMouse + 0.001);
                float wakeEnvelope = smoothstep(1.2, 0.2, wakeAngle) * step(-0.01, -behindMouse);
                // Wake ripples
                float wakeDist = length(toMouse);
                float wakeWave = sin(wakeDist * 30.0 - u_time * 4.0);
                float wakeDecay = exp(-wakeDist * 6.0);
                float wake = wakeWave * wakeDecay * wakeEnvelope * velInfluence;

                // Combined disturbance as normal displacement
                float combinedRipple = (ripple + wake) * 0.6;
                vec2 disturbance = toMouseNorm * combinedRipple * 0.15;

                // === Noise domain with disturbance ===
                vec2 p = zUv * 3.0 + disturbance;
                vec2 q = vec2(
                    fbm(p + vec2(0.0, 0.0) + t * 0.3),
                    fbm(p + vec2(5.2, 1.3) + t * 0.2)
                );
                vec2 r = vec2(
                    fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.15),
                    fbm(p + 4.0 * q + vec2(8.3, 2.8) + t * 0.1)
                );
                float f = fbm(p + 4.0 * r);

                // Warmer, brighter palette
                vec3 colorA = vec3(0.06, 0.04, 0.03);
                vec3 colorB = vec3(0.25, 0.12, 0.06);
                vec3 colorC = vec3(0.14, 0.06, 0.03);
                vec3 colorD = vec3(0.35, 0.20, 0.08);
                vec3 colorE = vec3(0.10, 0.14, 0.06);
                vec3 colorF = vec3(0.30, 0.08, 0.12);

                vec3 color = mix(colorA, colorB, clamp(f * f * 2.0, 0.0, 1.0));
                color = mix(color, colorC, clamp(length(q), 0.0, 1.0));
                color = mix(color, colorD, clamp(length(r.x) * 0.5, 0.0, 1.0));
                color = mix(color, colorE, clamp(r.y * 0.3 + 0.2, 0.0, 1.0));

                // Vignette
                float vignette = 1.0 - 0.35 * length((uv - 0.5) * 1.5);
                color *= vignette;

                gl_FragColor = vec4(color, 1.0);
            }
        `;

        function createShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            return shader;
        }

        const vert = createShader(gl.VERTEX_SHADER, vertSrc);
        const frag = createShader(gl.FRAGMENT_SHADER, fragSrc);
        if (!vert || !frag) return;

        const program = gl.createProgram();
        gl.attachShader(program, vert);
        gl.attachShader(program, frag);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            console.error('Program link error:', gl.getProgramInfoLog(program));
            return;
        }
        gl.useProgram(program);

        const posBuffer = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

        const aPos = gl.getAttribLocation(program, 'a_position');
        gl.enableVertexAttribArray(aPos);
        gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

        const uTime = gl.getUniformLocation(program, 'u_time');
        const uRes = gl.getUniformLocation(program, 'u_resolution');
        const uMouse = gl.getUniformLocation(program, 'u_mouse');
        const uMouseVel = gl.getUniformLocation(program, 'u_mouse_vel');
        const uZoom = gl.getUniformLocation(program, 'u_zoom');

        let rawMouseX = 0.5, rawMouseY = 0.5;
        let smoothX = 0.5, smoothY = 0.5;
        let prevSmoothX = 0.5, prevSmoothY = 0.5;
        let velX = 0.0, velY = 0.0;
        document.addEventListener('mousemove', function(e) {
            rawMouseX = e.clientX / window.innerWidth;
            rawMouseY = 1.0 - e.clientY / window.innerHeight;
        });

        // Reference camera distance for zoom sync
        const INITIAL_Z = 50.0;

        function render(time) {
            // Smooth mouse position to eliminate jitter
            smoothX += (rawMouseX - smoothX) * 0.08;
            smoothY += (rawMouseY - smoothY) * 0.08;

            // Velocity: smoothed delta with exponential decay
            let frameVelX = (smoothX - prevSmoothX);
            let frameVelY = (smoothY - prevSmoothY);
            velX = velX * 0.82 + frameVelX * 0.18;
            velY = velY * 0.82 + frameVelY * 0.18;
            prevSmoothX = smoothX;
            prevSmoothY = smoothY;

            // Sync zoom with Three.js camera distance
            let zoomFactor = 1.0;
            if (typeof camera !== 'undefined') {
                const dist = camera.position.length();
                zoomFactor = Math.max(0.2, dist / INITIAL_Z);
            }

            gl.uniform1f(uTime, time * 0.001);
            gl.uniform2f(uRes, canvas.width, canvas.height);
            gl.uniform2f(uMouse, smoothX, smoothY);
            gl.uniform2f(uMouseVel, velX, velY);
            gl.uniform1f(uZoom, zoomFactor);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);
    })();
    </script>
