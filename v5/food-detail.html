<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Detail - What You See is What You Eat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.detail-page {
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(circle at center, #2b1d1d 0%, #0a0908 100%);
            cursor: default;
        }
        
        #shader-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        
        #scene-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10; /* 光环和图片卡片层 */
            pointer-events: auto;
        }


        
        .detail-back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 3000;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            padding: 10px 20px;
            font-family: 'Sora', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.74);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(16px);
        }
        
        .detail-back-btn:hover {
            transform: translateX(-4px);
            border-color: rgba(255, 255, 255, 0.26);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        /* 信息面板 - 固定比例，挡住光环和图片 */
        .info-panel {
            position: fixed;
            z-index: 80; /* 在光环层之上，模型层之下 */
            width: min(334px, calc(100vw - 60px), calc((100vh - 80px) * 0.72));
            aspect-ratio: 5 / 6.75;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding-top: 0;
            padding-bottom: 18px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 18px;
            /* 更透明 + 强毛玻璃效果 */
            background: rgba(25, 20, 17, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(50px) saturate(1.2);
            -webkit-backdrop-filter: blur(50px) saturate(1.2);
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.5s ease;
            max-height: calc(100vh - 80px);
            overflow: hidden;
        }

        .info-panel.visible {
            opacity: 1;
        }

        .info-panel .text-content {
            flex: 1 1 auto;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .info-panel h2 {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.46rem;
            color: rgba(255, 250, 245, 0.95);
            margin: 0 0 4px;
            line-height: 1.2;
        }

        .info-panel .subtitle {
            font-family: 'Sora', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 7px;
        }

        .info-panel .description {
            display: none;
        }

        .info-panel .location {
            margin-top: 0;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        .intro-actions {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 0;
            margin-top: 15px;
            height: 50px;
        }

        .intro-action-btn {
            position: relative;
            width: 66px;
            height: 44px;
            padding: 0;
            border-radius: 4px 4px 18px 18px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background:
                linear-gradient(160deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.035) 58%),
                linear-gradient(180deg, rgba(89, 60, 39, 0.38), rgba(32, 24, 19, 0.76));
            color: rgba(255, 250, 245, 0.82);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 18px 34px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.16),
                inset 0 -18px 24px rgba(0, 0, 0, 0.16);
            transform-origin: 50% 100%;
            transition: transform 0.28s ease, background 0.28s ease, border-color 0.28s ease, color 0.28s ease, box-shadow 0.28s ease;
            backdrop-filter: blur(20px) saturate(1.15);
            -webkit-backdrop-filter: blur(20px) saturate(1.15);
            isolation: isolate;
        }

        .intro-action-btn::before {
            content: "";
            position: absolute;
            top: -7px;
            left: 13px;
            right: 13px;
            height: 12px;
            border-radius: 4px 4px 0 0;
            background: rgba(255, 244, 226, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-bottom: 0;
            z-index: -1;
        }

        .intro-action-btn::after {
            content: "";
            position: absolute;
            inset: 8px 10px auto;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.36), transparent);
            opacity: 0.8;
        }

        .intro-action-btn:hover {
            transform: translateY(-4px) rotate(-1.5deg);
            background:
                linear-gradient(160deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.055) 60%),
                linear-gradient(180deg, rgba(120, 76, 48, 0.48), rgba(38, 28, 21, 0.82));
            border-color: rgba(255, 255, 255, 0.26);
            color: #fff;
            box-shadow:
                0 22px 42px rgba(0, 0, 0, 0.38),
                0 0 34px rgba(254, 202, 87, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .intro-action-btn[data-intro-type="chef"] {
            margin-left: -10px;
            transform: translateY(4px) rotate(3deg);
            z-index: 1;
        }

        .intro-action-btn[data-intro-type="dish"] {
            transform: rotate(-3deg);
            z-index: 2;
        }

        .intro-action-btn[data-intro-type="chef"]:hover {
            transform: translateY(-2px) rotate(1.5deg);
        }

        .intro-action-btn[data-intro-type="dish"]:hover {
            transform: translateY(-4px) rotate(-4deg);
        }

        .intro-action-icon {
            width: 20px;
            height: 20px;
            flex: 0 0 auto;
            stroke: currentColor;
            stroke-width: 1.65;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            opacity: 0.92;
        }

        /* 模型占位区域 - 上方留白给3D模型，canvas直接放在这里 */
        .model-placeholder {
            width: 100%;
            flex: 0 0 50%;
            position: relative;
            overflow: visible;
            pointer-events: auto;
            cursor: grab;
        }

        .model-placeholder:active {
            cursor: grabbing;
        }

        .model-placeholder canvas {
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }

        /* 卡片详情弹窗 - 与信息面板风格一致 */
        .card-popup {
            position: fixed;
            z-index: 300;
            width: min(340px, calc(100vw - 80px));
            border-radius: 20px;
            background: rgba(25, 20, 17, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(50px) saturate(1.2);
            -webkit-backdrop-filter: blur(50px) saturate(1.2);
            opacity: 0;
            visibility: hidden;
            transform: translate3d(0, 10px, 0) scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s linear;
            pointer-events: auto;
        }

        .card-popup.visible {
            opacity: 1;
            visibility: visible;
            transform: translate3d(0, 0, 0) scale(1);
        }

        .card-popup-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.76);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.24s ease;
            z-index: 10;
        }

        .card-popup-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .card-popup-image {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
        }

        .card-popup-content {
            padding: 20px;
        }

        .card-popup-meta {
            display: none; /* 隐藏标题标签 */
        }

        .card-popup-side {
            color: rgba(255, 255, 255, 0.64);
        }

        .card-popup-index {
            color: rgba(255, 255, 255, 0.4);
        }

        .card-popup h3 {
            display: none; /* 隐藏标题 */
        }

        .card-popup p {
            margin: 0;
            font-size: 0.8rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.7);
            white-space: pre-line;
            max-height: 200px;
            overflow-y: auto;
        }

        /* 材料注释弹窗 */
        .material-note {
            position: fixed;
            z-index: 300;
            width: min(440px, calc(100vw - 80px));
            padding: 0;
            border-radius: 20px;
            background: rgba(25, 20, 17, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(50px) saturate(1.2);
            -webkit-backdrop-filter: blur(50px) saturate(1.2);
            opacity: 0;
            visibility: hidden;
            transform: translate3d(0, 10px, 0) scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s linear;
        }
        
        .material-note.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translate3d(0, 0, 0) scale(1);
        }
        
        .material-note-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.76);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.24s ease;
        }
        
        .material-note-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        
        .material-note-meta {
            display: none;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-family: 'Sora', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        
        .material-note-side {
            color: rgba(255, 255, 255, 0.64);
        }
        
        .material-note-index {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .material-note h3 {
            margin: 0 0 10px;
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.18rem;
            color: rgba(255, 250, 245, 0.96);
            line-height: 1.2;
        }

        .material-note-content {
            padding: 20px;
        }
        
        .material-note p {
            margin: 0;
            max-height: min(46vh, 420px);
            overflow-y: auto;
            font-size: 0.8rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.7);
            white-space: pre-line;
            padding-right: 4px;
        }

        .material-note p::-webkit-scrollbar {
            width: 4px;
        }

        .material-note p::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border-radius: 999px;
        }

        .material-note-video {
            display: none;
            width: 100%;
            aspect-ratio: 16 / 9;
            margin: 0;
            border-radius: 20px 20px 0 0;
            object-fit: cover;
            background: rgba(0, 0, 0, 0.32);
            border: 0;
        }

        .material-note.has-video .material-note-video {
            display: block;
        }
        
        .legend-label {
            position: fixed;
            z-index: 100;
            font-family: 'Sora', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .legend-label.visible {
            opacity: 1;
        }
        
        .legend-label.reality {
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .legend-label.ai {
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* ====== 移动端竖屏适配 ====== */
        @media (max-width: 768px) and (orientation: portrait) {
            .info-panel {
                width: min(calc(100vw - 32px), 306px);
                max-height: none;
                aspect-ratio: 5 / 6.75;
                padding: 0 15px 14px;
                border-radius: 16px;
                overflow: hidden;
            }

            .info-panel .model-placeholder {
                flex-basis: 48%;
                margin: 0 auto;
                width: 100%;
            }

            .info-panel .text-content {
                flex: 1 1 auto;
                min-height: 0;
            }

            .info-panel h2 {
                font-size: 1.04rem;
                margin-bottom: 2px;
            }

            .info-panel .subtitle {
                font-size: 0.55rem;
                margin-bottom: 4px;
            }

            .info-panel .description {
                display: none;
            }

            .info-panel .location {
                font-size: 0.52rem;
            }

            .intro-actions {
                gap: 12px;
                margin-top: 9px;
                height: 46px;
            }

            .intro-action-btn {
                width: 56px;
                height: 39px;
            }

            .intro-action-icon {
                width: 19px;
                height: 19px;
            }

            /* 竖屏下卡片弹窗居中显示 */
            .card-popup {
                width: calc(100vw - 32px);
                max-height: 70vh;
                left: 50% !important;
                top: auto !important;
                bottom: 16px;
                transform: translate3d(-50%, 0, 0) scale(0.95);
            }

            .card-popup.visible {
                transform: translate3d(-50%, 0, 0) scale(1);
            }

            .card-popup-image {
                aspect-ratio: 16/10;
            }

            .card-popup p {
                max-height: 100px;
                font-size: 0.72rem;
            }

            .card-popup-content {
                padding: 14px;
            }

            /* 材料注释弹窗适配 */
            .material-note {
                width: calc(100vw - 32px);
                left: 50% !important;
                top: auto !important;
                bottom: 16px;
                max-height: 70vh;
                overflow-y: auto;
                transform: translate3d(-50%, 0, 0) scale(0.96);
            }

            .material-note.is-visible {
                transform: translate3d(-50%, 0, 0) scale(1);
            }

            /* 图例标签隐藏或缩小 */
            .legend-label {
                display: none;
            }

            /* 返回按钮调整 */
            .detail-back-btn {
                top: 12px;
                left: 12px;
                padding: 8px 14px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body class="detail-page">
    <!-- Navigation Menu -->
    <div class="hamburger-menu">
        <button class="hamburger-btn" onclick="toggleMenu()">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
            <a href="index.html" class="menu-item">Home</a>
            <a href="about.html" class="menu-item">Team</a>
            <a href="exhibition.html" class="menu-item">Exhibition</a>
            <a href="https://recfro.github.io/" class="menu-item" target="_blank">Studio</a>
            <a href="https://instagram.com/futuretensehk" class="menu-item" target="_blank">Instagram</a>
        </div>
    </div>
    
    <button class="detail-back-btn" onclick="history.back()">
        <span>←</span> Back
    </button>
    
    <!-- Shader Background -->
    <canvas id="shader-bg"></canvas>

    <!-- 3D Scene Container (光环 + 图片卡片) -->
    <div id="scene-container"></div>

    <!-- Info Panel (挡住光环和图片) -->
    <div class="info-panel" id="infoPanel">
        <!-- 模型占位区域 - 中间留空给3D模型显示 -->
        <div class="model-placeholder"></div>
        <div class="text-content">
            <h2 id="dishTitle">Loading...</h2>
            <div class="subtitle" id="dishSubtitle"></div>
            <div class="description" id="dishDescription"></div>
            <div class="location" id="dishLocation"></div>
            <div class="intro-actions">
                <button type="button" class="intro-action-btn" data-intro-type="dish" aria-label="介紹">
                    <svg class="intro-action-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z"></path>
                        <path d="M8 7h8"></path>
                        <path d="M8 11h7"></path>
                    </svg>
                </button>
                <button type="button" class="intro-action-btn" data-intro-type="chef" aria-label="師傅">
                    <svg class="intro-action-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="3.2"></circle>
                        <path d="M5.5 20a6.5 6.5 0 0 1 13 0"></path>
                        <path d="M7.8 4.6C8.8 2.9 11 3 12 4.3c1-1.3 3.2-1.4 4.2.3"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Card Popup - Reality (左侧弹窗) -->
    <div class="card-popup" id="cardPopupReality">
        <button class="card-popup-close" aria-label="Close">×</button>
        <img class="card-popup-image" alt="">
        <div class="card-popup-content">
            <div class="card-popup-meta">
                <span class="card-popup-side"></span>
                <span class="card-popup-index"></span>
            </div>
            <h3></h3>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Card Popup - AI (右侧弹窗) -->
    <div class="card-popup" id="cardPopupAI">
        <button class="card-popup-close" aria-label="Close">×</button>
        <img class="card-popup-image" alt="">
        <div class="card-popup-content">
            <div class="card-popup-meta">
                <span class="card-popup-side"></span>
                <span class="card-popup-index"></span>
            </div>
            <h3></h3>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Legend Labels -->
    <div class="legend-label reality" id="legendReality">REALITY</div>
    <div class="legend-label ai" id="legendAI">VARIATION</div>
    
    <!-- Material Note Popup -->
    <div class="material-note" id="materialNote" hidden>
        <button class="material-note-close" id="materialNoteClose" aria-label="Close">×</button>
        <div class="material-note-meta">
            <span class="material-note-side" id="materialNoteSide"></span>
            <span class="material-note-index" id="materialNoteIndex"></span>
        </div>
        <video class="material-note-video" id="materialNoteVideo" controls playsinline preload="metadata"></video>
        <div class="material-note-content">
            <h3 id="materialNoteTitle"></h3>
            <p id="materialNoteBody"></p>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        // ============================================
        // 食物详情页 - 光环布局版本
        // ============================================
        
        // 全局变量
        let scene, camera, renderer; // 光环和图片卡片场景
        let foodModelScene, foodModelRenderer, foodModelCamera, foodModel; // 食物模型独立渲染
        let decorativeRing = null;
        let decorativeParticles = null;
        let realityCards = [];
        let aiCards = [];
        let animationId;
        let controls; // 轨道控制器
        let raycaster, mouse; // 射线检测
        let allCards = []; // 所有卡片
        
        // AI卡片角度范围（动态计算）
        let aiAngleStart = -Math.PI;
        let aiAngleEnd = -Math.PI * 0.5;
        
        // 光环半径 (首页内层光环约15-17，这里放大两倍约30-34)
        const RING_RADIUS = 32;
        const RING_TUBE_RADIUS = 0.15;
        
        // 获取URL参数
        function getDishIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return normalizeDishId(params.get('dish') || 'claypot');
        }
        
        // 模型配置
        const modelPaths = {
            'claypot': 'models/claypot-rice.fbx',
            'steam-buns': 'models/meat-bun.fbx',
            'hakka-tofu': 'models/garden-tofu.fbx',
            'liuyang-steamed-ribs': 'models/spicy-ribs.fbx',
            'stir-fried-beef': 'models/spicy-ribs.fbx',
            'preserved-veg-pork': 'models/preserved-veg-pork.fbx',
            'vermicelli-shrimp': 'models/vermicelli-shrimp.fbx'
        };
        
        // 素材配置
        const assetManifest = {

            'claypot': `康哥是香港嚐囍煲仔小菜的主廚，對煲仔飯有著深厚的經驗和見解。我們通過電話聯繫與親自拜訪，誠摯邀請他參與採訪，他欣然應允並分享了寶貴的烹飪心得。

Kang is the head chef at Chang Hei Claypot Rice in Hong Kong, with deep expertise and insights into claypot rice. Through phone calls and in-person visits, we sincerely invited him to participate in the interview. He graciously accepted and shared his valuable culinary insights.

在共創過程中，他把煲仔飯看成由器具、火候與時間共同塑造的手藝。他特別在意不同年代的飯煲如何改變米飯的鬆散度、鍋巴與香氣，也認為 AI 可以幫助學徒看見火力過猛、熱力不足或米飯被壓得太實時會產生的差異。對他來說，煲仔飯不是煮熟就完成，而是慢慢「煨」出來的；有些切臘腸、判斷米粒狀態的細節，仍然要靠手勢和現場經驗才能說清楚。

In the co-creation process, he treats clay pot rice as a craft shaped by vessels, heat, and time. He pays close attention to how different generations of rice pots change the looseness of the grains, the crust, and the aroma. He also sees AI as a useful teaching tool: apprentices could compare what happens when heat is too strong, too weak, or when the rice is pressed too tightly. For him, clay pot rice is not simply cooked; it is slowly simmered into place. Some details, such as slicing Chinese sausage or judging the strength of each grain, still need gestures and lived kitchen experience.`,

            'hakka-tofu': `身為客家人，小李（化名）為我們展示了他們家庭製作客家釀豆腐的過程，並嘗試使用 AI 記錄不同的偶然性；他也根據 AI 的提示，創作了一道保留傳統味道的創新菜。

As a Hakka cook, Xiao Li (pseudonym) showed us his family's process for making Hakka stuffed tofu. He also tried using AI to record moments of variation and, following AI prompts, created an innovative dish that still preserved the traditional taste.

他的判斷很清楚：AI 的擺盤想像可以被採納，例如加入蔬菜讓畫面與營養更豐富；但只要食材改動會讓味道離開客家釀豆腐本身，他就會保留距離。最後真正被採納的不是整份 AI 食譜，而是在不改變主味的前提下，加入少量玉米與更清爽的呈現方式。他也提醒我們，缺少勾芡用的澱粉會讓豆腐失去柔滑，而 AI 很難呈現人們心中「真的好吃」背後的情感差異。

His judgment is precise: AI's plating ideas can be useful, such as adding vegetables for stronger visual and nutritional balance, but changes that pull the dish away from Hakka flavor have to be resisted. What he finally adopted was not the full AI recipe, but a modest adjustment: a little corn and a lighter presentation that does not disturb the main taste. He also notes that without starch for thickening, the tofu loses its tender smoothness, and that AI still struggles to carry the emotional difference behind what people remember as truly delicious.`,

            'steam-buns': `我們很榮幸邀請到廚師王，與我們分享她對包子的見解，探討這一傳統美食的深厚文化底蘊及其在現代社會的演變。

We are honored to have invited Chef Wang to share her insights on steam buns, exploring the profound cultural heritage of this traditional delicacy and its evolution in modern society.

這位點心師傅同時有設計背景，所以她看包子的方式既重視手感，也重視畫面細節。她指出，包子的摺褶、收口與手勢很難只靠文字描述，AI 也容易把中式麵點工具誤生成西式糕點工具。她把在法式甜點店學到的 poolish 隔夜發酵法帶回包子製作，讓包子更柔軟、老化更慢；同時也能敏銳看出 AI 圖像裡過度油亮、筷子角度一致、褶子太假的痕跡。

The dim sum chef also has a design background, so she reads steamed buns through both hand technique and visual detail. She points out that pleating, closing, and shaping gestures are hard to describe in words, and AI often confuses Chinese bun-making tools with Western pastry equipment. She brings a poolish method learned in a French pastry shop into bun-making to make the buns softer and slower to age, while also spotting AI artifacts such as over-greasy styling, identical chopstick angles, and fake-looking folds.`,

            'liuyang-steamed-ribs': `我們邀請到了湘菜主廚張師傅，分享了他對瀏陽蒸排骨的理解，以及如何在保持傳統工藝的同時，用 AI 探索食材搭配的新可能。

We invited Chef Zhang, a Xiang cuisine master chef, to share his understanding of Liuyang steamed ribs and how to use AI to explore new possibilities in ingredient pairing while maintaining traditional craftsmanship.

在後續討論中，這道菜被理解為鹹、辣、鮮與蒸汽時間的平衡。AI 可以延展出高蛋白套餐與更健康的組合，但當它把菜推向檸檬汁、蜂蜜等分子料理式醬汁時，就會偏離原本的鹹辣鮮香。真正有價值的創新更像是傳統內部的小變化：用乾辣椒粉替代鮮辣椒，帶出煙燻和厚實的辣味；或用柴火灶與木蒸籠，讓燃木香氣在蒸製中滲入排骨。

In the later discussion, the dish is understood as a balance of saltiness, heat, savoriness, and time inside steam. AI can extend it into healthier, high-protein set meals, but when it pushes the dish toward molecular-style sauces with lemon juice and honey, it moves away from the original salty, spicy, savory profile. The more meaningful innovations are small changes from within the tradition: replacing fresh chilies with dried chili powder for a smokier, earthier heat, or using a wood-fired stove and wooden steamer so the aroma of burning wood infuses the ribs.`,

            'stir-fried-beef': `我們邀請到了湘菜廚師劉師傅，分享了他對小炒黃牛肉火候掌控的心得，並嘗試用 AI 模擬不同炒制參數下的風味變化。

We invited Chef Liu, a Xiang cuisine chef, to share his insights on controlling the heat for stir-fried beef, and attempted to use AI to simulate flavor changes under different stir-frying parameters.

他的經驗來自長期在海外廚房裡調整湘菜：有時需要用土耳其辣椒替代中國常見的螺絲椒，也會因外國客人的接受度調整牛肉切片厚度與辣椒用量。但他仍然很清楚小炒黃牛肉的核心：辣椒應該被切碎並炒到入味，而不是像 AI 圖像裡那樣完整、鮮亮、像剛被拼貼到盤子上。火候過高會讓牛肉變老、鍋底發焦；真正的鍋氣來自速度、熱度與食材狀態的精準配合。

His experience comes from adapting Hunan cooking in an overseas kitchen: sometimes Turkish chilies replace the Chinese spiral chilies, and beef thickness or chili level may be adjusted for foreign diners. Still, he is precise about the core of Hunan-style stir-fried beef: the chilies should be chopped and cooked into the dish, not appear whole, bright, and freshly assembled as in some AI images. Excessive heat toughens the beef and burns the bottom of the wok; real wok aroma comes from the exact coordination of speed, heat, and ingredient state.`,

            'preserved-veg-pork': `我們邀請到了客家料理傳承人陳阿姨，展示了她家傳的梅菜豬肉製作技法，並探索 AI 如何幫助記錄和傳承這門手藝。

We invited Auntie Chen, a Hakka cuisine inheritor, to demonstrate her family's traditional techniques for making preserved vegetable pork, and explored how AI can help record and pass on this culinary art.

這道菜的故事連回母親教她的家傳方法：家裡炒乾梅菜時會加入豬油，讓梅菜香氣更厚、更溫潤；但在倫敦，食材條件不同，做法需要被調整。她也留意到海外五花肉常被切得較薄，會改變口感與香氣。對她來說，關鍵不只在肉，還在醬汁是否能均勻滲入；她習慣用紅糖炒糖色，避免冰糖過易焦化，並在快完成時再加入蒜，讓香氣最後釋放出來。

The story of this dish connects back to a family method taught by her mother: at home, dried mustard greens were stir-fried with lard, giving them a deeper, warmer aroma; in London, different ingredient conditions mean the method has to be adapted. She also notices that pork belly abroad is often sliced thinner, changing both texture and flavor. For her, the key is not only the pork but how evenly the sauce enters the dish. She prefers brown sugar for caramelizing because rock sugar burns more easily, and she adds garlic near the end so its fragrance opens at the final moment.`,

            'vermicelli-shrimp': `我們邀請到了粵菜廚師何師傅，分享了他對粉絲蝦煲的烹飪秘訣，以及如何運用 AI 構思海鮮與粉絲的新穎搭配方式。

In the discussion of ingredient substitution, the dish also shows the reality of cooking overseas: large head-on prawns are hard to find in many foreign supermarkets, and peeled shrimp make the whole pot taste less deep. The soaking temperature and timing of the vermicelli also matter; if it soaks too long, it becomes too soft and changes how it absorbs sauce. When cooking for foreign friends, cilantro can be replaced with parsley, butter can stand in for part of the soy sauce in the garlic sauce, and onions can add extra aroma. A useful trick is to blanch minced garlic first so it does not burn too dark in the oil.`

        // 初始化场景
        function init() {
            // ========== 主场景（光环 + 图片卡片）==========
            const container = document.getElementById('scene-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x2a0808, 30, 150);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            const cameraAngle = 0;
            const cameraRadius = RING_RADIUS - 5;
            camera.position.set(
                Math.cos(cameraAngle) * cameraRadius,
                3,
                Math.sin(cameraAngle) * cameraRadius
            );
            camera.lookAt(
                Math.cos(Math.PI) * (RING_RADIUS - 5),
                0,
                Math.sin(Math.PI) * (RING_RADIUS - 5)
            );

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableRotate = false;
            controls.enableZoom = false;
            controls.enablePan = false;
            controls.target.set(
                Math.cos(Math.PI) * (RING_RADIUS - 5),
                0,
                Math.sin(Math.PI) * (RING_RADIUS - 5)
            );

            // 射线检测初始化
            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // 添加灯光到主场景
            addLights(scene);

            // 创建装饰性光环
            createDecorativeRing();

            // 创建图片卡片
            const dishId = getDishIdFromURL();
            createImageCards(dishId);

        function addLights(targetScene) {

        // 创建装饰性光环 - 单层，直径变大两倍
        function createDecorativeRing() {
            // 波浪形圆环
            const segments = 300;
            const points = [];
            
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                // 波浪起伏
                const waveOffset = Math.sin(angle * 6) * 1.2 + Math.sin(angle * 10) * 0.6;
                const r = RING_RADIUS + waveOffset * 0.8;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                const y = waveOffset * 1.5;
                points.push(new THREE.Vector3(x, y, z));
            }
            
            const curve = new THREE.CatmullRomCurve3(points, true);
            const tubeGeometry = new THREE.TubeGeometry(curve, 500, RING_TUBE_RADIUS, 12, true);
            
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0xfff8e7,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            
            decorativeRing = new THREE.Mesh(tubeGeometry, ringMaterial);
            decorativeRing.rotation.x = 0.1; // 轻微倾斜
            scene.add(decorativeRing);
            
            // 粒子光环
            createParticleRing();
        }
        
        // 创建粒子光环
        function createParticleRing() {
            const particleCount = 250;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (i / particleCount) * Math.PI * 2;
                const waveY = (Math.random() - 0.5) * 3;
                const radiusVariation = RING_RADIUS + (Math.random() - 0.5) * 2;
                
                positions[i * 3] = Math.cos(angle) * radiusVariation;
                positions[i * 3 + 1] = waveY;
                positions[i * 3 + 2] = Math.sin(angle) * radiusVariation;
                
                // 淡金色粒子
                const colorVariation = 0.9 + Math.random() * 0.1;
                colors[i * 3] = colorVariation;
                colors[i * 3 + 1] = colorVariation * 0.92;
                colors[i * 3 + 2] = colorVariation * 0.75;
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.45,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            decorativeParticles = new THREE.Points(geometry, material);
            scene.add(decorativeParticles);
        }
        
        // 加载食物模型 - 直接放在info-panel的留白区域内
        function loadFoodModelFixed(dishId) {
            const modelPath = modelPaths[dishId];
            if (!modelPath) {
                showInfoPanel();
                return;
            }

            // 直接用 model-placeholder 作为容器

        // 创建图片卡片 - 沿光环圆周分布
        function createImageCards(dishId) {
            const manifest = assetManifest[dishId];
            if (!manifest) return;
            
            const realityFiles = [...(manifest.reality || []), ...(manifest.videos || [])];
            const aiFiles = manifest.ai || [];
            
            // Reality 卡片 - 摄像机左边光环 (从左到右循环)
            // 相机在0度看向180度，左边是 90度 到 180度 区域（靠近食物模型）
            createCardsOnRing(realityFiles, manifest.folder, 'reality', Math.PI * 0.5, Math.PI);

            // AI 卡片 - 摄像机右边光环 (从左到右循环)
            // 根据AI图片数量动态调整角度范围，避免卡片过密
            // 基准：6张图用90°范围，每多1张增加15°
            const aiCount = aiFiles.length;
            const baseRange = Math.PI * 0.5; // 90°
            const extraRange = aiCount > 6 ? (aiCount - 6) * (Math.PI / 12) : 0; // 每多1张+15°
            const totalRange = baseRange + extraRange;
            aiAngleStart = -Math.PI - extraRange / 2;
            aiAngleEnd = -Math.PI * 0.5 + extraRange / 2;
            createCardsOnRing(aiFiles, manifest.folder, 'ai', aiAngleStart, aiAngleEnd);
        }
        
        // 在光环上创建卡片
        function createCardsOnRing(files, folder, side, startAngle, endAngle) {
            const cardsToRender = (files || []).filter(filename => !/\.(mp4|mov|webm)$/i.test(filename));
            const angleRange = endAngle - startAngle;
            const angleStep = cardsToRender.length > 1 ? angleRange / (cardsToRender.length - 1) : 0;

            cardsToRender.forEach((filename, index) => {
                const angle = startAngle + angleStep * index;
                const radius = RING_RADIUS - 3;

                const isVideo = filename.endsWith('.mp4') || filename.endsWith('.mov');
                const folderName = side === 'reality' ?
                    (isVideo ? 'video' : 'Reality') : 'AI';

                // 获取文件名（不含扩展名）用于加载对应的MD
                const fileStem = filename.replace(/\.[^.]+$/, '');

                const card = {
                    angle: angle,
                    radius: radius,
                    // 上下错开更多：奇偶交错，幅度增大
                    height: (index % 2 === 0 ? 4 : -4) + (index * 0.5),
                    // 速度：Reality从左到右(角度增加)，AI也从左到右(角度增加)
                    speed: 0.0008,
                    side: side,
                    type: isVideo ? 'video' : 'image',
                    src: `food/${folder}/${folderName}/${filename}`,
                    mdSrc: `food/${folder}/${folderName}/${fileStem}.md`,
                    title: `${side === 'reality' ? 'Reality' : 'AI'} ${index + 1}`,
                    filename: filename,
                    fileStem: fileStem,
                    index: index
                };

                if (side === 'reality') {
                    realityCards.push(card);
                } else {
                    aiCards.push(card);
                }

                // 创建3D卡片
                createCardMesh(card);
            });
        }

        // 创建卡片网格 - 带圆角
        function createCardMesh(card) {
            const cardWidth = 6;
            const cardHeight = 4.5;

            // 加载图片并添加圆角
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                // 创建canvas绘制圆角图片
                const canvas = document.createElement('canvas');
                const w = 512;
                const h = Math.round(w * cardHeight / cardWidth);
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');

                // 先清空为透明
                ctx.clearRect(0, 0, w, h);

                // 绘制圆角矩形路径并裁剪
                const r = 30; // canvas圆角像素
                ctx.beginPath();
                ctx.moveTo(r, 0);
                ctx.lineTo(w - r, 0);
                ctx.quadraticCurveTo(w, 0, w, r);
                ctx.lineTo(w, h - r);
                ctx.quadraticCurveTo(w, h, w - r, h);
                ctx.lineTo(r, h);
                ctx.quadraticCurveTo(0, h, 0, h - r);
                ctx.lineTo(0, r);
                ctx.quadraticCurveTo(0, 0, r, 0);
                ctx.closePath();
                ctx.clip();

                // 绘制图片 - 保持原始比例覆盖整个画布
                const imgAspect = img.naturalWidth / img.naturalHeight;
                const canvasAspect = w / h;
                let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
                if (imgAspect > canvasAspect) {
                    // 图片更宽，裁剪左右
                    sw = img.naturalHeight * canvasAspect;
                    sx = (img.naturalWidth - sw) / 2;
                } else {
                    // 图片更高，裁剪上下
                    sh = img.naturalWidth / canvasAspect;
                    sy = (img.naturalHeight - sh) / 2;
                }
                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);

                // 创建纹理
                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;

                // 使用普通矩形平面，圆角由canvas纹理透明区域实现
                const geometry = new THREE.PlaneGeometry(cardWidth, cardHeight);

                const material = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    side: THREE.DoubleSide
                });

                const mesh = new THREE.Mesh(geometry, material);

                // 定位在光环上
                mesh.position.x = Math.cos(card.angle) * card.radius;
                mesh.position.z = Math.sin(card.angle) * card.radius;
                mesh.position.y = card.height;

                // 面向中心
                mesh.lookAt(0, card.height, 0);

                mesh.userData = card;
                card.mesh = mesh;

                scene.add(mesh);
                allCards.push(mesh);
            };
            img.onerror = function() {
                console.error('Failed to load image:', card.src);
            };
            img.src = card.src;
        }
        
        // 食物介紹資料（從 MD 文件載入）
        let dishDescriptions = {};

        // 解析 MD 文件，提取各菜品描述
        function parseDescriptionsMD(mdContent) {
            const descriptions = {};
            const lines = mdContent.split('\n');
            let currentId = null;
            let currentContent = [];

            for (const line of lines) {
                // 匹配 ## dish-id 格式的標題
                const match = line.match(/^##\s+(\S+)/);
                if (match) {
                    // 保存上一個 section
                    if (currentId) {
                        descriptions[currentId] = splitIntroContent(currentContent);
                    }
                    currentId = normalizeDishId(match[1]);
                    currentContent = [];
                } else if (currentId) {
                    // 跳過一級標題行
                    if (!line.startsWith('# ')) {
                        currentContent.push(line);
                    }
                }
            }
            // 保存最後一個 section
            if (currentId) {
                descriptions[currentId] = splitIntroContent(currentContent);
            }
            return descriptions;
        }

        function splitIntroContent(lines) {
            const paragraphs = lines.join('\n')
                .replace(/\r/g, '')
                .split(/\n\s*\n+/)
                .map(text => text.trim())
                .filter(Boolean);
            const chefPattern = /(廚|主廚|chef|Chef|邀請|invited|honored|榮幸|身為|展示|founded|創立|分享)/;
            let splitIndex = paragraphs.findIndex(text => chefPattern.test(text));

            if (splitIndex <= 0) {
                splitIndex = Math.max(1, Math.ceil(paragraphs.length / 2));
            }

            return {
                dish: paragraphs.slice(0, splitIndex).join('\n\n'),
                chef: paragraphs.slice(splitIndex).join('\n\n')
            };
        }

                dishDescriptions = parseDescriptionsMD(mdContent);
            } catch (error) {
                console.error('Error loading descriptions:', error);
            }
        }

        function positionIntroPopup(note) {
            const isPortrait = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
            const infoPanel = document.getElementById('infoPanel');
            const introType = note.dataset.introType || 'chef';

            note.style.left = '-9999px';
            note.style.top = '-9999px';

            if (isPortrait || !infoPanel) {
                note.style.left = '';
                note.style.top = '';
                return;
            }

            const panelRect = infoPanel.getBoundingClientRect();
            const gap = 20;
            const preferredWidth = 440;
            const sideSpace = introType === 'dish'
                ? panelRect.left - gap - 18
                : window.innerWidth - panelRect.right - gap - 18;
            const fittedWidth = Math.max(300, Math.min(preferredWidth, sideSpace));

            note.style.width = `${fittedWidth}px`;

            const noteRect = note.getBoundingClientRect();
            let left = introType === 'dish'
                ? panelRect.left - noteRect.width - gap
                : panelRect.right + gap;

            if (introType === 'dish' && left < 18) {
                left = 18;
            } else if (introType !== 'dish' && left + noteRect.width > window.innerWidth - 18) {
                left = window.innerWidth - noteRect.width - 18;
            }

            const top = panelRect.top + (panelRect.height / 2) - (noteRect.height / 2);

            note.style.left = `${Math.max(18, Math.min(left, window.innerWidth - noteRect.width - 18))}px`;
            note.style.top = `${Math.max(18, Math.min(top, window.innerHeight - noteRect.height - 18))}px`;
        }

        // 动画循环
        function animate() {
            animationId = requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // 更新控制器
            if (controls) {
                controls.update();
            }

            // 旋转光环
            if (decorativeRing) {
                decorativeRing.rotation.y += 0.0005;
            }

            // 旋转粒子
            if (decorativeParticles) {
                decorativeParticles.rotation.y += 0.0008;
            }

            // 更新卡片位置 - 沿光环循环
            updateCards(realityCards, time);
            updateCards(aiCards, time);

            // 渲染场景
            renderer.render(scene, camera);
        }
        
        // 更新卡片 - 沿光环圆周移动
        function updateCards(cards, time) {
            cards.forEach(card => {
                if (!card.mesh) return;

                // 更新角度
                card.angle += card.speed;

                // 循环范围：Reality和AI各自的范围
                if (card.side === 'reality') {
                    // Reality: 在90°到180°之间循环
                    if (card.angle > Math.PI) {
                        card.angle = Math.PI * 0.5;
                    }
                } else {
                    // AI: 在动态计算的角度范围内循环
                    if (card.angle > aiAngleEnd) {
                        card.angle = aiAngleStart;
                    }
                }

                // 更新位置
                card.mesh.position.x = Math.cos(card.angle) * card.radius;
                card.mesh.position.z = Math.sin(card.angle) * card.radius;
                card.mesh.position.y = card.height + Math.sin(time + card.index) * 0.5;

                // 面向中心
                card.mesh.lookAt(0, card.mesh.position.y, 0);
            });
        }

        // Shader 背景 (与首页相同)
        function initShaderBackground() {
            const canvas = document.getElementById('shader-bg');
            if (!canvas) return;
            
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return;
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            resize();
            window.addEventListener('resize', resize);
            
            const vertSrc = `
                attribute vec2 a_position;
                void main() {
                    gl_Position = vec4(a_position, 0.0, 1.0);
                }
            `;
            
            const fragSrc = `
                precision highp float;
                uniform float u_time;
                uniform vec2 u_resolution;
                
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }
                
                float snoise(vec2 v) {
                    const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                                       -0.577350269189626, 0.024390243902439);
                    vec2 i  = floor(v + dot(v, C.yy));
                    vec2 x0 = v - i + dot(i, C.xx);
                    vec2 i1;
                    i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                    vec4 x12 = x0.xyxy + C.xxzz;
                    x12.xy -= i1;
                    i = mod289(i);
                    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
                    vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
                    m = m * m;
                    m = m * m;
                    vec3 x = 2.0 * fract(p * C.www) - 1.0;
                    vec3 h = abs(x) - 0.5;
                    vec3 ox = floor(x + 0.5);
                    vec3 a0 = x - ox;
                    m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
                    vec3 g;
                    g.x = a0.x * x0.x + h.x * x0.y;
                    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                    return 130.0 * dot(m, g);
                }
                
                float fbm(vec2 p) {
                    float value = 0.0;
                    float amplitude = 0.5;
                    float frequency = 1.0;
                    for (int i = 0; i < 5; i++) {
                        value += amplitude * snoise(p * frequency);
                        frequency *= 2.0;
                        amplitude *= 0.5;
                    }
                    return value;
                }
                
                void main() {
                    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                    float t = u_time * 0.15;
                    
                    vec2 p = uv * 3.0;
                    vec2 q = vec2(
                        fbm(p + vec2(0.0, 0.0) + t * 0.3),
                        fbm(p + vec2(5.2, 1.3) + t * 0.2)
                    );
                    vec2 r = vec2(
                        fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.15),
                        fbm(p + 4.0 * q + vec2(8.3, 2.8) + t * 0.1)
                    );
                    float f = fbm(p + 4.0 * r);
                    
                    vec3 colorA = vec3(0.06, 0.04, 0.03);
                    vec3 colorB = vec3(0.25, 0.12, 0.06);
                    vec3 colorC = vec3(0.14, 0.06, 0.03);
                    vec3 colorD = vec3(0.35, 0.20, 0.08);
                    
                    vec3 color = mix(colorA, colorB, clamp(f * f * 2.0, 0.0, 1.0));
                    color = mix(color, colorC, clamp(length(q), 0.0, 1.0));
                    color = mix(color, colorD, clamp(length(r.x) * 0.5, 0.0, 1.0));
                    
                    float vignette = 1.0 - 0.35 * length((uv - 0.5) * 1.5);
                    color *= vignette;
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `;
            
            function createShader(type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                    gl.deleteShader(shader);
                    return null;
                }
                return shader;
            }
            
            const vert = createShader(gl.VERTEX_SHADER, vertSrc);
            const frag = createShader(gl.FRAGMENT_SHADER, fragSrc);
            if (!vert || !frag) return;
            
            const program = gl.createProgram();
            gl.attachShader(program, vert);
            gl.attachShader(program, frag);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(program));
                return;
            }
            gl.useProgram(program);
            
            const posBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
            
            const aPos = gl.getAttribLocation(program, 'a_position');
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
            
            const uTime = gl.getUniformLocation(program, 'u_time');
            const uRes = gl.getUniformLocation(program, 'u_resolution');
            
            function render(time) {
                gl.uniform1f(uTime, time * 0.001);
                gl.uniform2f(uRes, canvas.width, canvas.height);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        }
        
        // 材料注释交互
        document.addEventListener('DOMContentLoaded', async function() {
            // 先加载描述数据，再初始化页面
            await loadDescriptions();
            init();
            
            // 关闭注释按钮
            const closeBtn = document.getElementById('materialNoteClose');
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    closeMaterialNote();
                });
            }

            const introVideo = document.getElementById('materialNoteVideo');
            if (introVideo) {
                introVideo.addEventListener('ended', function() {
                    playNextChefVideo(introVideo);
                });
            }
        });
    </script>
