<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Detail - What You See is What You Eat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.detail-page {
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(circle at center, #2b1d1d 0%, #0a0908 100%);
            cursor: default;
        }
        
        #shader-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        
        #scene-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 10; /* 光环和图片卡片层 */
            pointer-events: auto;
        }


        
        .detail-back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 3000;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            padding: 10px 20px;
            font-family: 'Sora', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.74);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(16px);
        }
        
        .detail-back-btn:hover {
            transform: translateX(-4px);
            border-color: rgba(255, 255, 255, 0.26);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        /* 信息面板 - 纵向长方形，挡住光环和图片 */
        .info-panel {
            position: fixed;
            z-index: 80; /* 在光环层之上，模型层之下 */
            width: min(340px, calc(100vw - 60px));
            padding-top: 0;
            padding-bottom: 40px;
            padding-left: 28px;
            padding-right: 28px;
            border-radius: 20px;
            /* 更透明 + 强毛玻璃效果 */
            background: rgba(25, 20, 17, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(50px) saturate(1.2);
            -webkit-backdrop-filter: blur(50px) saturate(1.2);
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.5s ease;
            max-height: calc(100vh - 80px);
            overflow: visible; /* 允许模型旋转时超出面板 */
        }

        .info-panel.visible {
            opacity: 1;
        }

        .info-panel .text-content {
            max-height: calc(100vh - 80px - 340px); /* 减去模型占位高度 */
            overflow-y: auto;
        }

        .info-panel h2 {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.6rem;
            color: rgba(255, 250, 245, 0.95);
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .info-panel .subtitle {
            font-family: 'Sora', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .info-panel .description {
            font-size: 0.82rem;
            line-height: 1.75;
            color: rgba(255, 255, 255, 0.65);
            max-height: 400px;
            overflow-y: auto;
        }

        .info-panel .location {
            margin-top: 12px;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        /* 模型占位区域 - 上方留白给3D模型，canvas直接放在这里 */
        .model-placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            position: relative;
            overflow: visible; /* 允许旋转时模型超出 */
            pointer-events: auto;
            cursor: grab;
        }

        .model-placeholder:active {
            cursor: grabbing;
        }

        .model-placeholder canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* 卡片详情弹窗 - 与信息面板风格一致 */
        .card-popup {
            position: fixed;
            z-index: 300;
            width: min(340px, calc(100vw - 80px));
            border-radius: 20px;
            background: rgba(25, 20, 17, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(50px) saturate(1.2);
            -webkit-backdrop-filter: blur(50px) saturate(1.2);
            opacity: 0;
            visibility: hidden;
            transform: translate3d(0, 10px, 0) scale(0.95);
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s linear;
            pointer-events: auto;
        }

        .card-popup.visible {
            opacity: 1;
            visibility: visible;
            transform: translate3d(0, 0, 0) scale(1);
        }

        .card-popup-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.76);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.24s ease;
            z-index: 10;
        }

        .card-popup-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .card-popup-image {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 20px 20px 0 0;
        }

        .card-popup-content {
            padding: 20px;
        }

        .card-popup-meta {
            display: none; /* 隐藏标题标签 */
        }

        .card-popup-side {
            color: rgba(255, 255, 255, 0.64);
        }

        .card-popup-index {
            color: rgba(255, 255, 255, 0.4);
        }

        .card-popup h3 {
            display: none; /* 隐藏标题 */
        }

        .card-popup p {
            margin: 0;
            font-size: 0.8rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.7);
            white-space: pre-line;
            max-height: 200px;
            overflow-y: auto;
        }

        /* 材料注释弹窗 */
        .material-note {
            position: fixed;
            z-index: 5000;
            width: min(380px, calc(100vw - 40px));
            padding: 18px 18px 16px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04)),
                        rgba(17, 13, 12, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(26px);
            opacity: 0;
            visibility: hidden;
            transform: translate3d(0, 10px, 0) scale(0.96);
            transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s linear;
        }
        
        .material-note.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translate3d(0, 0, 0) scale(1);
        }
        
        .material-note-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.76);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.24s ease;
        }
        
        .material-note-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        
        .material-note-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-family: 'Sora', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        
        .material-note-side {
            color: rgba(255, 255, 255, 0.64);
        }
        
        .material-note-index {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .material-note h3 {
            margin: 0 0 10px;
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.18rem;
            color: rgba(255, 250, 245, 0.96);
            line-height: 1.2;
        }
        
        .material-note p {
            margin: 0;
            font-size: 0.8rem;
            line-height: 1.75;
            color: rgba(255, 255, 255, 0.7);
            white-space: pre-line;
        }
        
        .legend-label {
            position: fixed;
            z-index: 100;
            font-family: 'Sora', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .legend-label.visible {
            opacity: 1;
        }
        
        .legend-label.reality {
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .legend-label.ai {
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* ====== 移动端竖屏适配 ====== */
        @media (max-width: 768px) and (orientation: portrait) {
            .info-panel {
                width: calc(100vw - 32px);
                max-height: 48vh;
                padding: 14px 14px 16px;
                border-radius: 16px;
                overflow-y: auto;
                overflow-x: hidden;
            }

            .info-panel .model-placeholder {
                aspect-ratio: 1 / 1;
                max-height: 22vh;
                width: auto;
                margin: 0 auto;
                overflow: hidden;
            }

            .info-panel .text-content {
                max-height: none;
                overflow: visible;
            }

            .info-panel h2 {
                font-size: 1.1rem;
                margin-bottom: 2px;
            }

            .info-panel .subtitle {
                font-size: 0.55rem;
                margin-bottom: 4px;
            }

            .info-panel .description {
                font-size: 0.68rem;
                line-height: 1.55;
                max-height: 80px;
                overflow-y: auto;
            }

            .info-panel .location {
                margin-top: 4px;
                font-size: 0.52rem;
            }

            /* 竖屏下卡片弹窗居中显示 */
            .card-popup {
                width: calc(100vw - 32px);
                max-height: 70vh;
                left: 50% !important;
                top: auto !important;
                bottom: 16px;
                transform: translate3d(-50%, 0, 0) scale(0.95);
            }

            .card-popup.visible {
                transform: translate3d(-50%, 0, 0) scale(1);
            }

            .card-popup-image {
                aspect-ratio: 16/10;
            }

            .card-popup p {
                max-height: 100px;
                font-size: 0.72rem;
            }

            .card-popup-content {
                padding: 14px;
            }

            /* 材料注释弹窗适配 */
            .material-note {
                width: calc(100vw - 32px);
                left: 50% !important;
                top: auto !important;
                bottom: 16px;
                transform: translate3d(-50%, 0, 0) scale(0.96);
            }

            .material-note.is-visible {
                transform: translate3d(-50%, 0, 0) scale(1);
            }

            /* 图例标签隐藏或缩小 */
            .legend-label {
                display: none;
            }

            /* 返回按钮调整 */
            .detail-back-btn {
                top: 12px;
                left: 12px;
                padding: 8px 14px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>
<body class="detail-page">
    <!-- Navigation Menu -->
    <div class="hamburger-menu">
        <button class="hamburger-btn" onclick="toggleMenu()">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
            <a href="index.html" class="menu-item">Home</a>
            <a href="about.html" class="menu-item">Team</a>
            <a href="exhibition.html" class="menu-item">Exhibition</a>
            <a href="https://recfro.github.io/" class="menu-item" target="_blank">Studio</a>
            <a href="https://instagram.com/futuretensehk" class="menu-item" target="_blank">Instagram</a>
        </div>
    </div>
    
    <button class="detail-back-btn" onclick="history.back()">
        <span>←</span> Back
    </button>
    
    <!-- Shader Background -->
    <canvas id="shader-bg"></canvas>

    <!-- 3D Scene Container (光环 + 图片卡片) -->
    <div id="scene-container"></div>

    <!-- Info Panel (挡住光环和图片) -->
    <div class="info-panel" id="infoPanel">
        <!-- 模型占位区域 - 中间留空给3D模型显示 -->
        <div class="model-placeholder"></div>
        <div class="text-content">
            <h2 id="dishTitle">Loading...</h2>
            <div class="subtitle" id="dishSubtitle"></div>
            <div class="description" id="dishDescription"></div>
            <div class="location" id="dishLocation"></div>
        </div>
    </div>

    <!-- Card Popup - Reality (左侧弹窗) -->
    <div class="card-popup" id="cardPopupReality">
        <button class="card-popup-close" aria-label="Close">×</button>
        <img class="card-popup-image" src="" alt="">
        <div class="card-popup-content">
            <div class="card-popup-meta">
                <span class="card-popup-side"></span>
                <span class="card-popup-index"></span>
            </div>
            <h3></h3>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Card Popup - AI (右侧弹窗) -->
    <div class="card-popup" id="cardPopupAI">
        <button class="card-popup-close" aria-label="Close">×</button>
        <img class="card-popup-image" src="" alt="">
        <div class="card-popup-content">
            <div class="card-popup-meta">
                <span class="card-popup-side"></span>
                <span class="card-popup-index"></span>
            </div>
            <h3></h3>
            <p>Loading...</p>
        </div>
    </div>

    <!-- Legend Labels -->
    <div class="legend-label reality" id="legendReality">REALITY</div>
    <div class="legend-label ai" id="legendAI">VARIATION</div>
    
    <!-- Material Note Popup -->
    <div class="material-note" id="materialNote" hidden>
        <button class="material-note-close" id="materialNoteClose" aria-label="Close">×</button>
        <div class="material-note-meta">
            <span class="material-note-side" id="materialNoteSide"></span>
            <span class="material-note-index" id="materialNoteIndex"></span>
        </div>
        <h3 id="materialNoteTitle"></h3>
        <p id="materialNoteBody"></p>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        // ============================================
        // 食物详情页 - 光环布局版本
        // ============================================
        
        // 全局变量
        let scene, camera, renderer; // 光环和图片卡片场景
        let foodModelScene, foodModelRenderer, foodModelCamera, foodModel; // 食物模型独立渲染
        let decorativeRing = null;
        let decorativeParticles = null;
        let realityCards = [];
        let aiCards = [];
        let animationId;
        let controls; // 轨道控制器
        let raycaster, mouse; // 射线检测
        let allCards = []; // 所有卡片
        
        // AI卡片角度范围（动态计算）
        let aiAngleStart = -Math.PI;
        let aiAngleEnd = -Math.PI * 0.5;
        
        // 光环半径 (首页内层光环约15-17，这里放大两倍约30-34)
        const RING_RADIUS = 32;
        const RING_TUBE_RADIUS = 0.15;
        
        // 获取URL参数
        function getDishIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('dish') || 'claypot';
        }
        
        // 模型配置
        const modelPaths = {
            'claypot': '../models/claypot-rice.fbx',
            'steam-buns': '../models/meat-bun.fbx',
            'hakka-tofu': '../models/garden-tofu.fbx',
            'liuyang-steamed-ribs': '../models/spicy-ribs.fbx',
            'stir-fried-beef': '../models/spicy-ribs.fbx',
            'preserved-veg-pork': '../models/preserved-veg-pork.fbx',
            'vermicelli-shrimp': '../models/vermicelli-shrimp.fbx'
        };
        
        // 素材配置
        const assetManifest = {
            'claypot': {
                folder: 'claypot-rice',
                reality: ['rice-dry.png', '漏勺.png', '火山石.png', '人去转观察火力.png', '腊肠饭.png', '白饭.PNG'],
                videos: ['VID20241112204313.mp4', 'VID20241112204653.mp4'],
                ai: ['caihong.png', 'lachang.png', 'paigu.png', 'taiguo.png', 'wodanniu.png', 'xingkong.png']
            },
            'steam-buns': {
                folder: 'steamed-buns',
                reality: ['baozi.png'],
                videos: ['fen_DJI_0003.mp4', 'ya_DJI_0006.mp4', 'bao_DJI_0044.mp4', 'steam_DJI_0050.mp4'],
                ai: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png']
            },
            'hakka-tofu': {
                folder: 'hakka-tofu',
                reality: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg'],
                videos: ['VID20241215111124.mp4', 'VID20241215111137.mp4', 'cut_VID20241215110009.mp4', 'fry_VID20241215111725.mp4'],
                ai: ['1.png', '1-1.jpg', '2.png', '3.png', '4.png', '5.png', '6.png']
            },
            'liuyang-steamed-ribs': {
                folder: 'LiuyangSteamedRibs',
                reality: ['1.png', '2.png', '3.jpg', '4.png', '5.png', '6.png', '7.png'],
                videos: ['videoplayback.mp4'],
                ai: ['1.png', '2.png', '3.png', '4.png']
            },
            'stir-fried-beef': {
                folder: 'spicy-ribs',
                reality: ['xiaochaohuangniu.png'],
                videos: ['videoplayback.mp4'],
                ai: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png', '7.png', '8.png', '9.png', '10.png', '12.png']
            },
            'preserved-veg-pork': {
                folder: 'preserved-veg-pork',
                reality: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png', '7.png'],
                videos: ['videoplayback.mp4'],
                ai: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png', '7.png', '8.png']
            },
            'vermicelli-shrimp': {
                folder: 'vermicelli-shrimp',
                reality: ['1.png', '2.JPG', '3.JPG', '4.png', '5.JPG', '6.png', '7.png', '8.png', '9.png', '10.png', '11.png', '12.png', '13.png'],
                videos: ['videoplayback.mp4'],
                ai: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png']
            }
        };
        
        // 菜品元数据
        const dishMeta = {
            'claypot': { title: '煲仔飯', subtitle: 'Clay Pot Rice', location: 'Guangdong · Hong Kong' },
            'steam-buns': { title: '流汁湯包', subtitle: 'Steam Buns', location: 'Jiangnan · China' },
            'hakka-tofu': { title: '客家釀豆腐', subtitle: 'Hakka Stuffed Tofu', location: 'Hakka · Guangdong' },
            'liuyang-steamed-ribs': { title: '瀏陽蒸排骨', subtitle: 'Liuyang Steamed Ribs', location: 'Liuyang · Hunan' },
            'stir-fried-beef': { title: '小炒黃牛肉', subtitle: 'Stir-fried Yellow Beef', location: 'Hunan · Wok Stir-fry' },
            'preserved-veg-pork': { title: '梅菜豬肉', subtitle: 'Preserved Veg Pork', location: 'Hakka · Preserved Flavour' },
            'vermicelli-shrimp': { title: '粉絲蝦煲', subtitle: 'Vermicelli Shrimp', location: 'Cantonese · Seafood Pot' }
        };
        
        // 初始化场景
        function init() {
            // ========== 主场景（光环 + 图片卡片）==========
            const container = document.getElementById('scene-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x2a0808, 30, 150);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            const cameraAngle = 0;
            const cameraRadius = RING_RADIUS - 5;
            camera.position.set(
                Math.cos(cameraAngle) * cameraRadius,
                3,
                Math.sin(cameraAngle) * cameraRadius
            );
            camera.lookAt(
                Math.cos(Math.PI) * (RING_RADIUS - 5),
                0,
                Math.sin(Math.PI) * (RING_RADIUS - 5)
            );

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.enablePan = false;
            controls.target.set(
                Math.cos(Math.PI) * (RING_RADIUS - 5),
                0,
                Math.sin(Math.PI) * (RING_RADIUS - 5)
            );

        // 创建装饰性光环 - 单层，直径变大两倍
        function createDecorativeRing() {
            // 波浪形圆环
            const segments = 300;
            const points = [];
            
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                // 波浪起伏
                const waveOffset = Math.sin(angle * 6) * 1.2 + Math.sin(angle * 10) * 0.6;
                const r = RING_RADIUS + waveOffset * 0.8;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                const y = waveOffset * 1.5;
                points.push(new THREE.Vector3(x, y, z));
            }
            
            const curve = new THREE.CatmullRomCurve3(points, true);
            const tubeGeometry = new THREE.TubeGeometry(curve, 500, RING_TUBE_RADIUS, 12, true);
            
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0xfff8e7,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            
            decorativeRing = new THREE.Mesh(tubeGeometry, ringMaterial);
            decorativeRing.rotation.x = 0.1; // 轻微倾斜
            scene.add(decorativeRing);
            
            // 粒子光环
            createParticleRing();
        }
        
        // 创建粒子光环
        function createParticleRing() {
            const particleCount = 250;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (i / particleCount) * Math.PI * 2;
                const waveY = (Math.random() - 0.5) * 3;
                const radiusVariation = RING_RADIUS + (Math.random() - 0.5) * 2;
                
                positions[i * 3] = Math.cos(angle) * radiusVariation;
                positions[i * 3 + 1] = waveY;
                positions[i * 3 + 2] = Math.sin(angle) * radiusVariation;
                
                // 淡金色粒子
                const colorVariation = 0.9 + Math.random() * 0.1;
                colors[i * 3] = colorVariation;
                colors[i * 3 + 1] = colorVariation * 0.92;
                colors[i * 3 + 2] = colorVariation * 0.75;
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.45,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            decorativeParticles = new THREE.Points(geometry, material);
            scene.add(decorativeParticles);
        }

        // 创建图片卡片 - 沿光环圆周分布
        function createImageCards(dishId) {
            const manifest = assetManifest[dishId];
            if (!manifest) return;
            
            const realityFiles = [...(manifest.reality || []), ...(manifest.videos || [])];
            const aiFiles = manifest.ai || [];
            
            // Reality 卡片 - 摄像机左边光环 (从左到右循环)
            // 相机在0度看向180度，左边是 90度 到 180度 区域（靠近食物模型）
            createCardsOnRing(realityFiles, manifest.folder, 'reality', Math.PI * 0.5, Math.PI);

            // AI 卡片 - 摄像机右边光环 (从左到右循环)
            // 根据AI图片数量动态调整角度范围，避免卡片过密
            // 基准：6张图用90°范围，每多1张增加15°
            const aiCount = aiFiles.length;
            const baseRange = Math.PI * 0.5; // 90°
            const extraRange = aiCount > 6 ? (aiCount - 6) * (Math.PI / 12) : 0; // 每多1张+15°
            const totalRange = baseRange + extraRange;
            aiAngleStart = -Math.PI - extraRange / 2;
            aiAngleEnd = -Math.PI * 0.5 + extraRange / 2;
            createCardsOnRing(aiFiles, manifest.folder, 'ai', aiAngleStart, aiAngleEnd);
        }
        
        // 在光环上创建卡片
        function createCardsOnRing(files, folder, side, startAngle, endAngle) {
            const angleRange = endAngle - startAngle;
            const angleStep = files.length > 1 ? angleRange / (files.length - 1) : 0;

            files.forEach((filename, index) => {
                const angle = startAngle + angleStep * index;
                const radius = RING_RADIUS - 3;

                const isVideo = filename.endsWith('.mp4') || filename.endsWith('.mov');
                const folderName = side === 'reality' ?
                    (isVideo ? 'video' : 'Reality') : 'AI';

                // 获取文件名（不含扩展名）用于加载对应的MD
                const fileStem = filename.replace(/\.[^.]+$/, '');

                const card = {
                    angle: angle,
                    radius: radius,
                    // 上下错开更多：奇偶交错，幅度增大
                    height: (index % 2 === 0 ? 4 : -4) + (index * 0.5),
                    // 速度：Reality从左到右(角度增加)，AI也从左到右(角度增加)
                    speed: 0.0008,
                    side: side,
                    type: isVideo ? 'video' : 'image',
                    src: `../food/${folder}/${folderName}/${filename}`,
                    mdSrc: `../food/${folder}/${folderName}/${fileStem}.md`,
                    title: `${side === 'reality' ? 'Reality' : 'AI'} ${index + 1}`,
                    filename: filename,
                    fileStem: fileStem,
                    index: index
                };

                if (side === 'reality') {
                    realityCards.push(card);
                } else {
                    aiCards.push(card);
                }

                // 创建3D卡片
                createCardMesh(card);
            });
        }

        // 创建卡片网格 - 带圆角
        function createCardMesh(card) {
            const cardWidth = 6;
            const cardHeight = 4.5;

            // 加载图片并添加圆角
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function() {
                // 创建canvas绘制圆角图片
                const canvas = document.createElement('canvas');
                const w = 512;
                const h = Math.round(w * cardHeight / cardWidth);
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext('2d');

                // 先清空为透明
                ctx.clearRect(0, 0, w, h);

                // 绘制圆角矩形路径并裁剪
                const r = 30; // canvas圆角像素
                ctx.beginPath();
                ctx.moveTo(r, 0);
                ctx.lineTo(w - r, 0);
                ctx.quadraticCurveTo(w, 0, w, r);
                ctx.lineTo(w, h - r);
                ctx.quadraticCurveTo(w, h, w - r, h);
                ctx.lineTo(r, h);
                ctx.quadraticCurveTo(0, h, 0, h - r);
                ctx.lineTo(0, r);
                ctx.quadraticCurveTo(0, 0, r, 0);
                ctx.closePath();
                ctx.clip();

                // 绘制图片 - 保持原始比例覆盖整个画布
                const imgAspect = img.naturalWidth / img.naturalHeight;
                const canvasAspect = w / h;
                let sx = 0, sy = 0, sw = img.naturalWidth, sh = img.naturalHeight;
                if (imgAspect > canvasAspect) {
                    // 图片更宽，裁剪左右
                    sw = img.naturalHeight * canvasAspect;
                    sx = (img.naturalWidth - sw) / 2;
                } else {
                    // 图片更高，裁剪上下
                    sh = img.naturalWidth / canvasAspect;
                    sy = (img.naturalHeight - sh) / 2;
                }
                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);

                // 创建纹理
                const texture = new THREE.CanvasTexture(canvas);
                texture.needsUpdate = true;

                // 使用普通矩形平面，圆角由canvas纹理透明区域实现
                const geometry = new THREE.PlaneGeometry(cardWidth, cardHeight);

                const material = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    side: THREE.DoubleSide
                });

                const mesh = new THREE.Mesh(geometry, material);

                // 定位在光环上
                mesh.position.x = Math.cos(card.angle) * card.radius;
                mesh.position.z = Math.sin(card.angle) * card.radius;
                mesh.position.y = card.height;

                // 面向中心
                mesh.lookAt(0, card.height, 0);

                mesh.userData = card;
                card.mesh = mesh;

                scene.add(mesh);
                allCards.push(mesh);
            };
            img.onerror = function() {
                console.error('Failed to load image:', card.src);
            };
            img.src = card.src;
        }

        // 点击画布检测卡片
        function onCanvasClick(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(allCards);

            if (intersects.length > 0) {
                const clickedMesh = intersects[0].object;
                const card = clickedMesh.userData;
                showCardPopup(card, event.clientX, event.clientY);
                // 阻止冒泡，避免触发document的点击关闭弹窗
                event.stopPropagation();
            }
        }

        // 显示卡片弹窗 - Reality和AI各自独立弹窗
        function showCardPopup(card, clickX, clickY) {
            const popupId = card.side === 'ai' ? 'cardPopupAI' : 'cardPopupReality';
            const popup = document.getElementById(popupId);
            const image = popup.querySelector('.card-popup-image');
            const sideEl = popup.querySelector('.card-popup-side');
            const indexEl = popup.querySelector('.card-popup-index');
            const titleEl = popup.querySelector('h3');
            const bodyEl = popup.querySelector('p');

            // 设置图片
            image.src = card.src;

            // 设置元数据
            sideEl.textContent = card.side === 'reality' ? 'REALITY' : 'AI VISION';
            indexEl.textContent = card.fileStem || `#${card.index + 1}`;

            // 设置标题
            titleEl.textContent = card.title;

            // 加载 MD 内容
            bodyEl.textContent = 'Loading...';
            if (card.mdSrc) {
                fetch(card.mdSrc)
                    .then(response => {
                        if (!response.ok) throw new Error('MD not found');
                        return response.text();
                    })
                    .then(text => {
                        bodyEl.textContent = text || 'No description available.';
                    })
                    .catch(() => {
                        bodyEl.textContent = card.side === 'reality'
                            ? `${card.filename} - Real captured moment from the cooking process.`
                            : `${card.filename} - AI generated variation exploring new possibilities.`;
                    });
            } else {
                bodyEl.textContent = card.side === 'reality'
                    ? `${card.filename} - Real captured moment from the cooking process.`
                    : `${card.filename} - AI generated variation exploring new possibilities.`;
            }

            // 定位弹窗
            const isPortrait = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;

            if (isPortrait) {
                // 竖屏：CSS !important 控制居中底部定位，JS 不设置冲突的 inline style
                popup.style.left = '';
                popup.style.top = '';
                popup.style.transform = '';
            } else {
                // 横屏：在信息面板旁边
                const infoPanel = document.getElementById('infoPanel');
                const panelRect = infoPanel.getBoundingClientRect();

                if (card.side === 'ai') {
                    popup.style.left = (panelRect.right + 20) + 'px';
                } else {
                    popup.style.left = (panelRect.left - 360) + 'px';
                }

                popup.style.top = '50%';
                popup.style.transform = 'translateY(-50%)';
            }

            popup.classList.add('visible');
        }

        // 动画循环
        function animate() {
            animationId = requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // 更新控制器
            if (controls) {
                controls.update();
            }

            // 旋转光环
            if (decorativeRing) {
                decorativeRing.rotation.y += 0.0005;
            }

            // 旋转粒子
            if (decorativeParticles) {
                decorativeParticles.rotation.y += 0.0008;
            }

            // 更新卡片位置 - 沿光环循环
            updateCards(realityCards, time);
            updateCards(aiCards, time);

            // 渲染场景
            renderer.render(scene, camera);
        }
        
        // 更新卡片 - 沿光环圆周移动
        function updateCards(cards, time) {
            cards.forEach(card => {
                if (!card.mesh) return;

                // 更新角度
                card.angle += card.speed;

                // 循环范围：Reality和AI各自的范围
                if (card.side === 'reality') {
                    // Reality: 在90°到180°之间循环
                    if (card.angle > Math.PI) {
                        card.angle = Math.PI * 0.5;
                    }
                } else {
                    // AI: 在动态计算的角度范围内循环
                    if (card.angle > aiAngleEnd) {
                        card.angle = aiAngleStart;
                    }
                }

                // 更新位置
                card.mesh.position.x = Math.cos(card.angle) * card.radius;
                card.mesh.position.z = Math.sin(card.angle) * card.radius;
                card.mesh.position.y = card.height + Math.sin(time + card.index) * 0.5;

                // 面向中心
                card.mesh.lookAt(0, card.mesh.position.y, 0);
            });
        }
        
        // 窗口大小变化
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

            // 竖屏/横屏切换时重新定位信息面板
            const panel = document.getElementById('infoPanel');
            if (panel) {
                const isPortrait = window.innerWidth <= 768 && window.innerHeight > window.innerWidth;
                if (isPortrait) {
                    panel.style.left = '50%';
                    panel.style.top = '16px';
                    panel.style.transform = 'translate(-50%, 0)';
                } else {
                    panel.style.left = '50%';
                    panel.style.top = '50%';
                    panel.style.transform = 'translate(-50%, -50%)';
                }
            }
        }
        
        // Shader 背景 (与首页相同)
        function initShaderBackground() {
            const canvas = document.getElementById('shader-bg');
            if (!canvas) return;
            
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return;
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            resize();
            window.addEventListener('resize', resize);
            
            const vertSrc = `
                attribute vec2 a_position;
                void main() {
                    gl_Position = vec4(a_position, 0.0, 1.0);
                }
            `;
            
            const fragSrc = `
                precision highp float;
                uniform float u_time;
                uniform vec2 u_resolution;
                
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }
                
                float snoise(vec2 v) {
                    const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                                       -0.577350269189626, 0.024390243902439);
                    vec2 i  = floor(v + dot(v, C.yy));
                    vec2 x0 = v - i + dot(i, C.xx);
                    vec2 i1;
                    i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                    vec4 x12 = x0.xyxy + C.xxzz;
                    x12.xy -= i1;
                    i = mod289(i);
                    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
                    vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
                    m = m * m;
                    m = m * m;
                    vec3 x = 2.0 * fract(p * C.www) - 1.0;
                    vec3 h = abs(x) - 0.5;
                    vec3 ox = floor(x + 0.5);
                    vec3 a0 = x - ox;
                    m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
                    vec3 g;
                    g.x = a0.x * x0.x + h.x * x0.y;
                    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                    return 130.0 * dot(m, g);
                }
                
                float fbm(vec2 p) {
                    float value = 0.0;
                    float amplitude = 0.5;
                    float frequency = 1.0;
                    for (int i = 0; i < 5; i++) {
                        value += amplitude * snoise(p * frequency);
                        frequency *= 2.0;
                        amplitude *= 0.5;
                    }
                    return value;
                }
                
                void main() {
                    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                    float t = u_time * 0.15;
                    
                    vec2 p = uv * 3.0;
                    vec2 q = vec2(
                        fbm(p + vec2(0.0, 0.0) + t * 0.3),
                        fbm(p + vec2(5.2, 1.3) + t * 0.2)
                    );
                    vec2 r = vec2(
                        fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.15),
                        fbm(p + 4.0 * q + vec2(8.3, 2.8) + t * 0.1)
                    );
                    float f = fbm(p + 4.0 * r);
                    
                    vec3 colorA = vec3(0.06, 0.04, 0.03);
                    vec3 colorB = vec3(0.25, 0.12, 0.06);
                    vec3 colorC = vec3(0.14, 0.06, 0.03);
                    vec3 colorD = vec3(0.35, 0.20, 0.08);
                    
                    vec3 color = mix(colorA, colorB, clamp(f * f * 2.0, 0.0, 1.0));
                    color = mix(color, colorC, clamp(length(q), 0.0, 1.0));
                    color = mix(color, colorD, clamp(length(r.x) * 0.5, 0.0, 1.0));
                    
                    float vignette = 1.0 - 0.35 * length((uv - 0.5) * 1.5);
                    color *= vignette;
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `;
            
            function createShader(type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                    gl.deleteShader(shader);
                    return null;
                }
                return shader;
            }
            
            const vert = createShader(gl.VERTEX_SHADER, vertSrc);
            const frag = createShader(gl.FRAGMENT_SHADER, fragSrc);
            if (!vert || !frag) return;
            
            const program = gl.createProgram();
            gl.attachShader(program, vert);
            gl.attachShader(program, frag);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(program));
                return;
            }
            gl.useProgram(program);
            
            const posBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
            
            const aPos = gl.getAttribLocation(program, 'a_position');
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
            
            const uTime = gl.getUniformLocation(program, 'u_time');
            const uRes = gl.getUniformLocation(program, 'u_resolution');
            
            function render(time) {
                gl.uniform1f(uTime, time * 0.001);
                gl.uniform2f(uRes, canvas.width, canvas.height);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        }
        
        // 材料注释交互
        document.addEventListener('DOMContentLoaded', function() {
            init();
            
            // 关闭注释按钮
            const closeBtn = document.getElementById('materialNoteClose');
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    const note = document.getElementById('materialNote');
                    note.classList.remove('is-visible');
                    setTimeout(() => note.hidden = true, 280);
                });
            }
        });
    </script>
