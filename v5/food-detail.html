<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Detail - What You See is What You Eat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.detail-page {
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(circle at center, #2b1d1d 0%, #0a0908 100%);
            cursor: default;
        }
        
        #shader-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        
        #scene-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 100; /* 提高到信息面板之上 */
            pointer-events: auto;
        }
        
        .detail-back-btn {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 3000;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 999px;
            padding: 10px 20px;
            font-family: 'Sora', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            color: rgba(255, 255, 255, 0.74);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            backdrop-filter: blur(16px);
        }
        
        .detail-back-btn:hover {
            transform: translateX(-4px);
            border-color: rgba(255, 255, 255, 0.26);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        
        /* 信息面板 - 纵向长方形，放在3D场景下层 */
        .info-panel {
            position: fixed;
            z-index: 60; /* 在3D场景之下 */
            width: min(320px, calc(100vw - 60px)); /* 缩小宽度 */
            padding-top: 160px; /* 上方留空给模型 */
            padding-bottom: 20px;
            padding-left: 24px;
            padding-right: 24px;
            border-radius: 20px;
            /* 背景更透明，让上层的3D模型显示出来 */
            background: linear-gradient(180deg, rgba(30, 24, 20, 0.85), rgba(18, 14, 12, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(40px);
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .info-panel.visible {
            opacity: 1;
        }

        .info-panel h2 {
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.6rem;
            color: rgba(255, 250, 245, 0.95);
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .info-panel .subtitle {
            font-family: 'Sora', sans-serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 12px;
        }

        .info-panel .description {
            font-size: 0.82rem;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.65);
            max-height: 120px;
            overflow-y: auto;
        }

        .info-panel .location {
            margin-top: 12px;
            font-size: 0.65rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.4);
        }

        /* 模型占位区域 - 上方留空 */
        .model-placeholder {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 140px;
            pointer-events: none;
        }
        
        /* 材料注释弹窗 */
        .material-note {
            position: fixed;
            z-index: 5000;
            width: min(380px, calc(100vw - 40px));
            padding: 18px 18px 16px;
            border-radius: 22px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.04)),
                        rgba(17, 13, 12, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.62);
            backdrop-filter: blur(26px);
            opacity: 0;
            visibility: hidden;
            transform: translate3d(0, 10px, 0) scale(0.96);
            transition: opacity 0.28s ease, transform 0.28s ease, visibility 0.28s linear;
        }
        
        .material-note.is-visible {
            opacity: 1;
            visibility: visible;
            transform: translate3d(0, 0, 0) scale(1);
        }
        
        .material-note-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 28px;
            height: 28px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.76);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.24s ease;
        }
        
        .material-note-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }
        
        .material-note-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            font-family: 'Sora', sans-serif;
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }
        
        .material-note-side {
            color: rgba(255, 255, 255, 0.64);
        }
        
        .material-note-index {
            color: rgba(255, 255, 255, 0.4);
        }
        
        .material-note h3 {
            margin: 0 0 10px;
            font-family: 'Libre Baskerville', Georgia, serif;
            font-size: 1.18rem;
            color: rgba(255, 250, 245, 0.96);
            line-height: 1.2;
        }
        
        .material-note p {
            margin: 0;
            font-size: 0.8rem;
            line-height: 1.75;
            color: rgba(255, 255, 255, 0.7);
            white-space: pre-line;
        }
        
        .legend-label {
            position: fixed;
            z-index: 100;
            font-family: 'Sora', sans-serif;
            font-size: 0.65rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.45);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        
        .legend-label.visible {
            opacity: 1;
        }
        
        .legend-label.reality {
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .legend-label.ai {
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
        }
    </style>
</head>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="js/main.js"></script>
    
    <script>
        // ============================================
        // 食物详情页 - 光环布局版本
        // ============================================
        
        // 全局变量
        let scene, camera, renderer;
        let foodModel = null;
        let decorativeRing = null;
        let decorativeParticles = null;
        let realityCards = [];
        let aiCards = [];
        let animationId;
        let controls; // 轨道控制器
        
        // 光环半径 (首页内层光环约15-17，这里放大两倍约30-34)
        const RING_RADIUS = 32;
        const RING_TUBE_RADIUS = 0.15;
        
        // 获取URL参数
        function getDishIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            return params.get('dish') || 'claypot';
        }
        
        // 模型配置
        const modelPaths = {
            'claypot': '../models/claypot-rice.fbx',
            'steam-buns': '../models/meat-bun.fbx',
            'hakka-tofu': '../models/garden-tofu.fbx',
            'healthy-ribs': '../models/healthy-ribs.fbx',
            'stir-fried-beef': '../models/spicy-ribs.fbx',
            'preserved-veg-pork': '../models/preserved-veg-pork.fbx',
            'vermicelli-shrimp': '../models/vermicelli-shrimp.fbx'
        };
        
        // 素材配置
        const assetManifest = {
            'claypot': {
                folder: 'claypot-rice',
                reality: ['lachang.png', 'paigu.png', 'wodanniu.png'],
                videos: ['VID20241112204313.mp4', 'VID20241112204653.mp4'],
                ai: ['caihong.png', 'taiguo.png', 'xingkong.png']
            },
            'steam-buns': {
                folder: 'steamed-buns',
                reality: ['baozi.png'],
                videos: ['fen_DJI_0003.mp4', 'ya_DJI_0006.mp4', 'bao_DJI_0044.mp4', 'steam_DJI_0050.mp4'],
                ai: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png']
            },
            'hakka-tofu': {
                folder: 'hakka-tofu',
                reality: ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg', '7.jpg', '8.jpg'],
                videos: ['VID20241215111124.mp4', 'VID20241215111137.mp4', 'cut_VID20241215110009.mp4', 'fry_VID20241215111725.mp4'],
                ai: ['1.png', '1-1.jpg', '2.png', '3.png', '4.png', '5.png', '6.png']
            },
            'healthy-ribs': {
                folder: 'healthy-ribs',
                reality: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png', '7.png'],
                videos: ['videoplayback.mp4'],
                ai: ['1.jpg', '2.png', '3.png', '4.png', '5.png']
            },
            'stir-fried-beef': {
                folder: 'spicy-ribs',
                reality: ['xiaochaohuangniu.png'],
                videos: ['videoplayback.mp4'],
                ai: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png', '7.png', '8.png', '9.png', '10.png', '12.png']
            },
            'preserved-veg-pork': {
                folder: 'preserved-veg-pork',
                reality: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png', '7.png'],
                videos: ['videoplayback.mp4'],
                ai: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png', '7.png', '8.png']
            },
            'vermicelli-shrimp': {
                folder: 'vermicelli-shrimp',
                reality: ['1.png', '2.JPG', '3.JPG', '4.png', '5.JPG', '6.png', '7.png', '8.png', '9.png', '10.png', '11.png', '12.png', '13.png'],
                videos: ['videoplayback.mp4'],
                ai: ['1.png', '2.png', '3.png', '4.png', '5.png', '6.png']
            }
        };
        
        // 菜品元数据
        const dishMeta = {
            'claypot': { title: '煲仔飯', subtitle: 'Clay Pot Rice', location: 'Guangdong · Hong Kong' },
            'steam-buns': { title: '流汁湯包', subtitle: 'Steam Buns', location: 'Jiangnan · China' },
            'hakka-tofu': { title: '客家釀豆腐', subtitle: 'Hakka Stuffed Tofu', location: 'Hakka · Guangdong' },
            'healthy-ribs': { title: '瀏陽蒸排骨', subtitle: 'Liuyang Steamed Ribs', location: 'Liuyang · Hunan' },
            'stir-fried-beef': { title: '小炒黃牛肉', subtitle: 'Stir-fried Yellow Beef', location: 'Hunan · Wok Stir-fry' },
            'preserved-veg-pork': { title: '梅菜豬肉', subtitle: 'Preserved Veg Pork', location: 'Hakka · Preserved Flavour' },
            'vermicelli-shrimp': { title: '粉絲蝦煲', subtitle: 'Vermicelli Shrimp', location: 'Cantonese · Seafood Pot' }
        };
        
        // 初始化场景
        function init() {
            const container = document.getElementById('scene-container');

            // 创建场景
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x2a0808, 30, 150);

            // 创建相机 - 放在光环内边缘，对着对面的食物模型
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            // 相机在光环的一侧内边缘 (角度为0度)
            const cameraAngle = 0;
            const cameraRadius = RING_RADIUS - 5; // 在光环内边缘
            camera.position.set(
                Math.cos(cameraAngle) * cameraRadius,
                3, // 眼睛高度
                Math.sin(cameraAngle) * cameraRadius
            );
            // 相机看向对面的光环内边缘 (180度位置)
            camera.lookAt(
                Math.cos(Math.PI) * (RING_RADIUS - 5),
                0,
                Math.sin(Math.PI) * (RING_RADIUS - 5)
            );

            // 创建渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setClearColor(0x000000, 0);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // 添加轨道控制器 - 允许鼠标控制摄像机
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.enableZoom = true;
            controls.enablePan = false;
            controls.target.set(
                Math.cos(Math.PI) * (RING_RADIUS - 5),
                0,
                Math.sin(Math.PI) * (RING_RADIUS - 5)
            );

            // 添加灯光
            addLights();

            // 创建装饰性光环 (单层，直径变大两倍)
            createDecorativeRing();

            // 加载食物模型
            const dishId = getDishIdFromURL();
            loadFoodModel(dishId);

            // 创建图片卡片
            createImageCards(dishId);

            // 更新页面信息
            updatePageInfo(dishId);

            // 启动动画
            animate();

            // 事件监听
            window.addEventListener('resize', onWindowResize, false);

            // 初始化 Shader 背景
            initShaderBackground();
        }
        
        function addLights() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            // 主光源 - 从相机位置照射
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.2);
            keyLight.position.set(0, 10, 20);
            scene.add(keyLight);
            
            // 补光
            const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
            fillLight.position.set(-15, 5, 10);
            scene.add(fillLight);
            
            // 边缘光
            const rimLight = new THREE.DirectionalLight(0xffffff, 0.8);
            rimLight.position.set(0, 5, -20);
            scene.add(rimLight);
            
            // 彩色点光源
            const accentLight1 = new THREE.PointLight(0xFFD700, 0.5, 60);
            accentLight1.position.set(20, 8, 0);
            scene.add(accentLight1);
            
            const accentLight2 = new THREE.PointLight(0xE8E8E8, 0.4, 60);
            accentLight2.position.set(-20, 8, 0);
            scene.add(accentLight2);
        }
        
        // 创建装饰性光环 - 单层，直径变大两倍
        function createDecorativeRing() {
            // 波浪形圆环
            const segments = 300;
            const points = [];
            
            for (let i = 0; i <= segments; i++) {
                const angle = (i / segments) * Math.PI * 2;
                // 波浪起伏
                const waveOffset = Math.sin(angle * 6) * 1.2 + Math.sin(angle * 10) * 0.6;
                const r = RING_RADIUS + waveOffset * 0.8;
                const x = Math.cos(angle) * r;
                const z = Math.sin(angle) * r;
                const y = waveOffset * 1.5;
                points.push(new THREE.Vector3(x, y, z));
            }
            
            const curve = new THREE.CatmullRomCurve3(points, true);
            const tubeGeometry = new THREE.TubeGeometry(curve, 500, RING_TUBE_RADIUS, 12, true);
            
            const ringMaterial = new THREE.MeshBasicMaterial({
                color: 0xfff8e7,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide,
                blending: THREE.AdditiveBlending
            });
            
            decorativeRing = new THREE.Mesh(tubeGeometry, ringMaterial);
            decorativeRing.rotation.x = 0.1; // 轻微倾斜
            scene.add(decorativeRing);
            
            // 粒子光环
            createParticleRing();
        }
        
        // 创建粒子光环
        function createParticleRing() {
            const particleCount = 250;
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (i / particleCount) * Math.PI * 2;
                const waveY = (Math.random() - 0.5) * 3;
                const radiusVariation = RING_RADIUS + (Math.random() - 0.5) * 2;
                
                positions[i * 3] = Math.cos(angle) * radiusVariation;
                positions[i * 3 + 1] = waveY;
                positions[i * 3 + 2] = Math.sin(angle) * radiusVariation;
                
                // 淡金色粒子
                const colorVariation = 0.9 + Math.random() * 0.1;
                colors[i * 3] = colorVariation;
                colors[i * 3 + 1] = colorVariation * 0.92;
                colors[i * 3 + 2] = colorVariation * 0.75;
            }
            
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            const material = new THREE.PointsMaterial({
                size: 0.4,
                vertexColors: true,
                transparent: true,
                opacity: 0.45,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            decorativeParticles = new THREE.Points(geometry, material);
            scene.add(decorativeParticles);
        }
        
        // 加载食物模型 - 放在光环内边缘，往摄像机方向移动
        function loadFoodModel(dishId) {
            const loader = new THREE.FBXLoader();
            const modelPath = modelPaths[dishId];

            if (!modelPath) return;

            loader.load(modelPath, function(object) {
                object.scale.setScalar(0.12);

                // 放在光环内边缘 (相机对面，约180度)
                const angle = Math.PI; // 相机在0度，模型在180度对面
                const modelRadius = RING_RADIUS - 18; // 往摄像机方向移动（原来-6）
                object.position.x = Math.cos(angle) * modelRadius;
                object.position.z = Math.sin(angle) * modelRadius;
                object.position.y = 2; // 稍微抬高

                // 面向摄像机：模型在180度，需要旋转180度面向0度的摄像机
                object.rotation.x = Math.PI * 40 / 180;
                object.rotation.y = 0; // 面向摄像机方向

                object.castShadow = true;
                object.receiveShadow = true;

                object.traverse(function(child) {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                foodModel = object;
                scene.add(object);

                // 显示信息面板
                showInfoPanel(angle, modelRadius);
            }, undefined, function(error) {
                console.error('FBX Load Failed:', modelPath, error);
            });
        }
        
        // 显示信息面板 - 放在屏幕中央，模型后面
        function showInfoPanel(angle, radius) {
            const panel = document.getElementById('infoPanel');

            // 放在屏幕中央，食物模型会显示在面板前面
            panel.style.left = '50%';
            panel.style.top = '50%';
            panel.style.transform = 'translate(-50%, -50%)';
            panel.classList.add('visible');

            // 显示图例标签
            document.getElementById('legendReality').classList.add('visible');
            document.getElementById('legendAI').classList.add('visible');
        }
        
        // 创建图片卡片 - 沿光环圆周分布
        function createImageCards(dishId) {
            const manifest = assetManifest[dishId];
            if (!manifest) return;
            
            const realityFiles = [...(manifest.reality || []), ...(manifest.videos || [])];
            const aiFiles = manifest.ai || [];
            
            // Reality 卡片 - 摄像机左边光环 (从左到右循环)
            // 相机在0度看向180度，左边是 90度 到 180度 区域（靠近食物模型）
            createCardsOnRing(realityFiles, manifest.folder, 'reality', Math.PI * 0.5, Math.PI);

            // AI 卡片 - 摄像机右边光环 (从左到右循环)
            // 相机在0度看向180度，右边是 -90度 到 -180度 区域（靠近食物模型）
            createCardsOnRing(aiFiles, manifest.folder, 'ai', -Math.PI, -Math.PI * 0.5);
        }
        
        // 在光环上创建卡片
        function createCardsOnRing(files, folder, side, startAngle, endAngle) {
            const angleRange = endAngle - startAngle;
            const angleStep = files.length > 1 ? angleRange / (files.length - 1) : 0;
            
            files.forEach((filename, index) => {
                const angle = startAngle + angleStep * index;
                const radius = RING_RADIUS - 3;
                
                const isVideo = filename.endsWith('.mp4') || filename.endsWith('.mov');
                const folderName = side === 'reality' ? 
                    (isVideo ? 'video' : 'Reality') : 'AI';
                
                const card = {
                    angle: angle,
                    radius: radius,
                    height: (Math.random() - 0.5) * 4,
                    // 速度：Reality从左到右(角度增加)，AI也从左到右(角度增加)
                    speed: 0.0008,
                    side: side,
                    type: isVideo ? 'video' : 'image',
                    src: `../food/${folder}/${folderName}/${filename}`,
                    title: `${side === 'reality' ? 'Reality' : 'AI'} ${index + 1}`,
                    index: index
                };
                
                if (side === 'reality') {
                    realityCards.push(card);
                } else {
                    aiCards.push(card);
                }
                
                // 创建3D卡片
                createCardMesh(card);
            });
        }
        
        // 创建卡片网格
        function createCardMesh(card) {
            // 创建卡片几何体
            const cardWidth = 4;
            const cardHeight = 3;
            const geometry = new THREE.PlaneGeometry(cardWidth, cardHeight);
            
            // 加载纹理
            const textureLoader = new THREE.TextureLoader();
            textureLoader.load(card.src, function(texture) {
                const material = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    opacity: 0.9,
                    side: THREE.DoubleSide
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                
                // 定位在光环上
                mesh.position.x = Math.cos(card.angle) * card.radius;
                mesh.position.z = Math.sin(card.angle) * card.radius;
                mesh.position.y = card.height;
                
                // 面向中心
                mesh.lookAt(0, card.height, 0);
                
                mesh.userData = card;
                card.mesh = mesh;
                
                scene.add(mesh);
            });
        }
        
        // 更新页面信息
        function updatePageInfo(dishId) {
            const meta = dishMeta[dishId];
            if (!meta) return;
            
            document.getElementById('dishTitle').textContent = meta.title;
            document.getElementById('dishSubtitle').textContent = meta.subtitle;
            document.getElementById('dishLocation').textContent = meta.location;
            
            // 尝试从 food.MD 加载描述
            fetch('../../food/food.MD')
                .then(response => response.text())
                .then(raw => {
                    const sections = parseFoodMD(raw);
                    const dish = sections.find(s => s.dishId === dishId);
                    if (dish && dish.description) {
                        document.getElementById('dishDescription').textContent = 
                            Array.isArray(dish.description) ? dish.description.join('\n\n') : dish.description;
                    }
                })
                .catch(() => {});
        }
        
        // 解析 food.MD
        function parseFoodMD(raw) {
            const text = String(raw || '');
            const sections = [];
            const headingPattern = /^#\s+(.+?)(?:\s+([\w\s&;]+))?\s*$/gm;
            const headings = [];
            let match;
            
            while ((match = headingPattern.exec(text)) !== null) {
                headings.push({
                    index: match.index,
                    titleZh: match[1].trim(),
                    titleEn: (match[2] || '').trim(),
                    rawLength: match[0].length
                });
            }
            
            for (let i = 0; i < headings.length; i++) {
                const h = headings[i];
                const start = h.index + h.rawLength;
                const end = i < headings.length - 1 ? headings[i + 1].index : text.length;
                const bodyText = text.slice(start, end).trim();
                const paragraphs = bodyText.split(/\n\n+/).map(p => p.trim()).filter(Boolean);
                
                const dishId = resolveDishId(h.titleZh);
                sections.push({
                    dishId: dishId,
                    title: h.titleZh,
                    subtitle: h.titleEn || '',
                    description: paragraphs
                });
            }
            
            return sections;
        }
        
        function resolveDishId(titleZh) {
            const map = {
                '煲仔飯': 'claypot',
                '客家釀豆腐': 'hakka-tofu',
                '流汁湯包': 'steam-buns',
                '瀏陽蒸排骨': 'healthy-ribs',
                '小炒黃牛肉': 'stir-fried-beef',
                '梅菜豬肉': 'preserved-veg-pork',
                '粉絲蝦煲': 'vermicelli-shrimp'
            };
            return map[titleZh] || '';
        }
        
        // 动画循环
        function animate() {
            animationId = requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // 更新控制器
            if (controls) {
                controls.update();
            }

            // 旋转光环
            if (decorativeRing) {
                decorativeRing.rotation.y += 0.0005;
            }

            // 旋转粒子
            if (decorativeParticles) {
                decorativeParticles.rotation.y += 0.0008;
            }

            // 模型浮动
            if (foodModel) {
                foodModel.position.y = 2 + Math.sin(time * 0.5) * 0.5;
                foodModel.rotation.y += 0.005;
            }

            // 更新卡片位置 - 沿光环循环
            updateCards(realityCards, time);
            updateCards(aiCards, time);
            
            renderer.render(scene, camera);
        }
        
        // 更新卡片 - 沿光环圆周移动
        function updateCards(cards, time) {
            cards.forEach(card => {
                if (!card.mesh) return;

                // 更新角度
                card.angle += card.speed;

                // 循环：Reality在90°到180°之间，AI在-180°到-90°之间
                if (card.side === 'reality') {
                    // Reality: 从90°移动到180°，超过则回到90°
                    if (card.angle > Math.PI) {
                        card.angle = Math.PI * 0.5;
                    }
                } else {
                    // AI: 从-180°移动到-90°，超过则回到-180°
                    if (card.angle > -Math.PI * 0.5) {
                        card.angle = -Math.PI;
                    }
                }

                // 更新位置
                card.mesh.position.x = Math.cos(card.angle) * card.radius;
                card.mesh.position.z = Math.sin(card.angle) * card.radius;
                card.mesh.position.y = card.height + Math.sin(time + card.index) * 0.5;

                // 面向中心
                card.mesh.lookAt(0, card.mesh.position.y, 0);
            });
        }
        
        // 窗口大小变化
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        // Shader 背景 (与首页相同)
        function initShaderBackground() {
            const canvas = document.getElementById('shader-bg');
            if (!canvas) return;
            
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (!gl) return;
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            resize();
            window.addEventListener('resize', resize);
            
            const vertSrc = `
                attribute vec2 a_position;
                void main() {
                    gl_Position = vec4(a_position, 0.0, 1.0);
                }
            `;
            
            const fragSrc = `
                precision highp float;
                uniform float u_time;
                uniform vec2 u_resolution;
                
                vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
                vec3 permute(vec3 x) { return mod289(((x * 34.0) + 1.0) * x); }
                
                float snoise(vec2 v) {
                    const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                                       -0.577350269189626, 0.024390243902439);
                    vec2 i  = floor(v + dot(v, C.yy));
                    vec2 x0 = v - i + dot(i, C.xx);
                    vec2 i1;
                    i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
                    vec4 x12 = x0.xyxy + C.xxzz;
                    x12.xy -= i1;
                    i = mod289(i);
                    vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
                    vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
                    m = m * m;
                    m = m * m;
                    vec3 x = 2.0 * fract(p * C.www) - 1.0;
                    vec3 h = abs(x) - 0.5;
                    vec3 ox = floor(x + 0.5);
                    vec3 a0 = x - ox;
                    m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
                    vec3 g;
                    g.x = a0.x * x0.x + h.x * x0.y;
                    g.yz = a0.yz * x12.xz + h.yz * x12.yw;
                    return 130.0 * dot(m, g);
                }
                
                float fbm(vec2 p) {
                    float value = 0.0;
                    float amplitude = 0.5;
                    float frequency = 1.0;
                    for (int i = 0; i < 5; i++) {
                        value += amplitude * snoise(p * frequency);
                        frequency *= 2.0;
                        amplitude *= 0.5;
                    }
                    return value;
                }
                
                void main() {
                    vec2 uv = gl_FragCoord.xy / u_resolution.xy;
                    float t = u_time * 0.15;
                    
                    vec2 p = uv * 3.0;
                    vec2 q = vec2(
                        fbm(p + vec2(0.0, 0.0) + t * 0.3),
                        fbm(p + vec2(5.2, 1.3) + t * 0.2)
                    );
                    vec2 r = vec2(
                        fbm(p + 4.0 * q + vec2(1.7, 9.2) + t * 0.15),
                        fbm(p + 4.0 * q + vec2(8.3, 2.8) + t * 0.1)
                    );
                    float f = fbm(p + 4.0 * r);
                    
                    vec3 colorA = vec3(0.06, 0.04, 0.03);
                    vec3 colorB = vec3(0.25, 0.12, 0.06);
                    vec3 colorC = vec3(0.14, 0.06, 0.03);
                    vec3 colorD = vec3(0.35, 0.20, 0.08);
                    
                    vec3 color = mix(colorA, colorB, clamp(f * f * 2.0, 0.0, 1.0));
                    color = mix(color, colorC, clamp(length(q), 0.0, 1.0));
                    color = mix(color, colorD, clamp(length(r.x) * 0.5, 0.0, 1.0));
                    
                    float vignette = 1.0 - 0.35 * length((uv - 0.5) * 1.5);
                    color *= vignette;
                    
                    gl_FragColor = vec4(color, 1.0);
                }
            `;
            
            function createShader(type, source) {
                const shader = gl.createShader(type);
                gl.shaderSource(shader, source);
                gl.compileShader(shader);
                if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                    console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                    gl.deleteShader(shader);
                    return null;
                }
                return shader;
            }
            
            const vert = createShader(gl.VERTEX_SHADER, vertSrc);
            const frag = createShader(gl.FRAGMENT_SHADER, fragSrc);
            if (!vert || !frag) return;
            
            const program = gl.createProgram();
            gl.attachShader(program, vert);
            gl.attachShader(program, frag);
            gl.linkProgram(program);
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(program));
                return;
            }
            gl.useProgram(program);
            
            const posBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
            
            const aPos = gl.getAttribLocation(program, 'a_position');
            gl.enableVertexAttribArray(aPos);
            gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
            
            const uTime = gl.getUniformLocation(program, 'u_time');
            const uRes = gl.getUniformLocation(program, 'u_resolution');
            
            function render(time) {
                gl.uniform1f(uTime, time * 0.001);
                gl.uniform2f(uRes, canvas.width, canvas.height);
                gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
                requestAnimationFrame(render);
            }
            requestAnimationFrame(render);
        }
        
        // 材料注释交互
        document.addEventListener('DOMContentLoaded', function() {
            init();
            
            // 关闭注释按钮
            const closeBtn = document.getElementById('materialNoteClose');
            if (closeBtn) {
                closeBtn.addEventListener('click', function() {
                    const note = document.getElementById('materialNote');
                    note.classList.remove('is-visible');
                    setTimeout(() => note.hidden = true, 280);
                });
            }
        });
    </script>
