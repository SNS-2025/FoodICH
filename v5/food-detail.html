<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Detail - What You See is What You Eat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/detail.css">
</head>
<body class="detail-page">

    <!-- Navigation -->
    <div class="hamburger-menu">
        <button class="hamburger-btn" onclick="toggleMenu()">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
        </button>
        <div class="menu-dropdown" id="menuDropdown">
            <a href="index.html" class="menu-item">Home</a>
            <a href="about.html" class="menu-item">Team</a>
            <a href="exhibition.html" class="menu-item">Exhibition</a>
            <a href="https://recfro.github.io/" class="menu-item" target="_blank">Studio</a>
            <a href="https://instagram.com/futuretensehk" class="menu-item" target="_blank">Instagram</a>
        </div>
    </div>

    <!-- Back Button -->
    <button class="detail-back-btn" onclick="history.back()">
        <span>←</span> Back
    </button>

    <!-- Particle Background -->
    <canvas id="detail-particle-canvas"></canvas>

    <div class="detail-desktop-bg">
        <div class="desktop-label" id="desktopLabel"></div>
    </div>

    <!-- 弧形环幕容器 -->
    <div class="arc-cinema-container">
        <!-- 左侧：实拍内容循环区 -->
        <aside class="reality-column" id="realityColumn">
            <div class="column-header">
                <span class="column-label">REALITY</span>
                <span class="column-subtitle">实拍记录</span>
            </div>
            <div class="arc-track" id="realityTrack"></div>
        </aside>

        <!-- 中间：3D模型 + 标题（弧形遮罩窗口） -->
        <main class="center-stage" id="centerStage">
            <div class="center-content">
                <div class="model-container">
                    <div class="model-stage" id="winModelStage">
                        <div class="model-status" id="winModelStatus">Loading 3D model...</div>
                    </div>
                </div>

                <div class="title-card">
                    <div class="title-main">
                        <h1 class="title-zh" id="titleCardZh"></h1>
                        <span class="title-separator">·</span>
                        <div class="title-en" id="titleCardEn"></div>
                    </div>
                    <div class="title-desc" id="titleDesc"></div>
                </div>
            </div>
        </main>

        <!-- 右侧：AI生成内容循环区 -->
        <aside class="ai-column" id="aiColumn">
            <div class="column-header">
                <span class="column-label">AI VISION</span>
                <span class="column-subtitle">AI生成图像</span>
            </div>
            <div class="arc-track" id="aiTrack"></div>
        </aside>
    </div>

    <!-- 统一的图片解释浮层 -->
    <div class="ai-explanation-overlay" id="aiExplanationOverlay" style="display: none;">
        <button class="ai-explanation-close" onclick="closeAIExplanation()">×</button>
        <div class="ai-explanation-content">
            <img id="aiExplanationImg" src="" alt="" style="display: none;">
            <div class="ai-explanation-text">
                <h3 id="aiExplanationTitle"></h3>
                <p id="aiExplanationDesc"></p>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/libs/fflate.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
